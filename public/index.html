<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Review</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2129; --panel2:#222b35; --border:#2d3845;
    --text:#e6edf3; --muted:#8b98a5; --accent:#4f9cf9;
    --green:#3fb950; --greenbg:rgba(63,185,80,.12);
    --red:#f85149; --redbg:rgba(248,81,73,.12); --amber:#d29922; --amberbg:rgba(210,153,34,.12);
    --cyan:#39d0d8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
  header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
  header h1{margin:0;font-size:18px;font-weight:650}
  header .sub{color:var(--muted);font-size:12px;margin-top:3px}
  .wrap{padding:14px 24px 48px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button,.btn,select,input[type=search]{
    font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 12px
  }
  .seg button{border:0;border-radius:0;cursor:pointer}
  .seg button.on{background:var(--accent);color:#08111f;font-weight:650}
  .btn{cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#08111f;border-color:var(--accent);font-weight:650}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
  .card .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .card .val{font-size:20px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
  .val.green{color:var(--green)} .val.red{color:var(--red)}
  .banner{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--muted);font-size:12px;margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
  .chip{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;font:inherit}
  .chip.on{background:rgba(79,156,249,.18);border-color:var(--accent);color:var(--accent);font-weight:600}
  .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel);max-height:calc(100vh - 340px)}
  table{border-collapse:collapse;width:100%;min-width:1680px}
  .stocktakes table{min-width:1100px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-size:11px;font-weight:650;text-align:right;z-index:1}
  th.l,td.l{text-align:left}
  tbody tr:hover{background:rgba(79,156,249,.06)}
  tbody tr.order{background:rgba(79,156,249,.04)}
  tbody tr.clickable{cursor:pointer}
  .tabs{display:flex;gap:6px;margin:0 0 12px}
  .tabs button{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;font:inherit}
  .tabs button.on{background:var(--accent);color:#08111f;font-weight:650}
  .tabs button:disabled{opacity:.4;cursor:not-allowed}
  .why{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .why p{margin:0 0 8px;line-height:1.45}
  .why p:last-child{margin-bottom:0}
  h2{font-size:14px;font-weight:650;margin:18px 0 8px}
  .neg{color:var(--red)} .pos{color:var(--green)}
  td input.dec{
    width:78px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);
    background:#0f1419;color:var(--text);text-align:right;font:inherit
  }
  .muted{color:var(--muted)}
  .err{color:var(--red);padding:20px}
  .totals{margin-top:16px;overflow:auto}
  .totals table{min-width:520px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:900px){.split{grid-template-columns:1fr}}
  .card.warn{border-color:rgba(248,81,73,.45);background:rgba(248,81,73,.08)}
  .card.good{border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.08)}
  .card.flat{border-color:rgba(210,153,34,.45);background:rgba(210,153,34,.08)}
  .chart{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px 8px;margin:12px 0}
  .chart svg{width:100%;height:240px;display:block}
  .chart .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;color:var(--muted);font-size:11px}
  .chart .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .demand-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  [data-tip]{cursor:help}
  #hover-tip{
    position:fixed;z-index:9999;max-width:340px;pointer-events:none;
    background:#141c24;border:1px solid var(--accent);border-radius:8px;
    padding:8px 11px;box-shadow:0 10px 28px rgba(0,0,0,.5);
    color:var(--text);font-size:12px;line-height:1.4;display:none
  }
  #hover-tip .tip-title{color:var(--accent);font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Stock Review</h1>
    <div class="sub">Forecast Orders Details — stock, utilisation, surplus, proposed buy. Decision is for GMs to type.</div>
  </div>
  <div class="row">
    <div class="seg" id="states"></div>
    <select id="month"></select>
    <button class="btn" id="onlyOrders" data-tip-title="Order lines only" data-tip="Show only SKUs FileMaker wants you to buy. Turn off to see the whole fleet.">Order lines only</button>
    <input type="search" id="q" placeholder="Search code or name" />
    <a class="btn primary" id="export" href="#" data-tip-title="Export Excel" data-tip="Download this state’s Details grid as an Excel file, including Decision values.">Export Excel</a>
  </div>
</header>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="on" data-view="details" data-tip-title="Details" data-tip="National ask grid — stock, surplus, proposed buy, and GM Decision.">Details</button>
    <button data-view="demand" id="tabDemand" disabled data-tip-title="Demand" data-tip="Why this item is on the ask: forecast starts, customer POs, and hire duration. Click a row first.">Demand</button>
    <button data-view="stocktakes" data-tip-title="Stocktakes" data-tip="Last FileMaker stocktake date versus the forecast cache date.">Stocktakes</button>
  </div>
  <div class="banner" id="banner">Loading StockCalculator…</div>
  <div id="view-details">
    <div class="cards" id="kpis"></div>
    <div class="chips" id="families"></div>
    <div class="table-wrap" id="grid"></div>
    <div class="totals" id="totals"></div>
  </div>
  <div id="view-demand" hidden></div>
  <div id="view-stocktakes" hidden></div>
</div>
<div id="hover-tip"></div>
<script>
const STATES = ["QLD","NSW","VIC","SA"];
let files = [];
let state = "QLD";
let month = "2026-09";
let data = null;
let family = "ALL";
let onlyOrders = true;
let q = "";
let view = "details";
let selectedCode = "";
let demand = null;
let demandScope = "item";
let stocktakes = null;
let staleDays = 14;
let staleOnly = true;
let stockSort = "stale";

const $ = (id) => document.getElementById(id);
const aud = (n) => (n||0).toLocaleString("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:0});
const num = (n) => (n||0).toLocaleString("en-AU");
const pct = (n) => n ? (n*100).toFixed(0)+"%" : "—";
const cls = (n) => n < 0 ? "neg" : n > 0 ? "pos" : "";

const TIPS = {
  originalAsk: "FileMaker proposed buy for this state and month — order qty × landed cost. This is the calculator ask, not a GM decision.",
  orderLines: "How many SKUs FileMaker wants you to buy (order qty greater than zero).",
  orderQtySum: "Total units FileMaker proposes buying on the current ask.",
  shortfallSkus: "Items where stock + current orders is below what target utilisation needs.",
  systemRequested: "System qty × landed cost. FileMaker’s system-requested quantity, usually close to the original ask.",
  decisionSoFar: "Dollar value of quantities typed in the Decision column. $0 means no GM buy has been entered yet.",
  familyChip: "Filter the grid to this family. The number is order lines; the $ is the original FileMaker ask.",
  item: "Inventory code. Full name on the grey line. Click the row (not Decision) to open Demand.",
  family: "Product family this item belongs to.",
  landed: "Landed cost per unit — what one more unit costs to buy.",
  onHand: "Units in the yard / depot, not currently on hire.",
  inService: "Units currently out on hire.",
  totalStock: "On hand + in service. The fleet you have today.",
  util: "In service ÷ total stock. How much of the fleet is out.",
  target: "FileMaker target utilisation. Required fleet = forecast peak in-service ÷ this target.",
  currentOrders: "Units already on order from suppliers, not yet in the fleet.",
  surplus: "Stock + current orders − required. Negative is a shortfall and drives the proposed buy.",
  orderQty: "FileMaker proposed buy for this state: enough units to cover the shortfall.",
  otherSug: "That other state’s FileMaker proposed order for the same item — so you can see if they are already buying it.",
  decision: "Type the qty you actually want to buy. This is the GM override of the calculator ask.",
  decisionCost: "Decision qty × landed cost.",
  systemQty: "FileMaker system-requested quantity for this state.",
  systemCost: "System qty × landed cost.",
  propSurplus: "Surplus after the proposed buy. Should move toward zero if you take the ask.",
  propUtil: "Utilisation after the proposed buy and expected demand.",
  orderCost: "Order qty × landed cost — the original ask for this line.",
  forecastMax: "FileMaker Forecast Max: peak in-service this item is expected to hit (already on hire + net starts), not the sum of monthly OUT.",
  required: "Fleet needed at target utilisation: ceil(forecast max ÷ target). This is the stock level the ask is trying to reach.",
  cover: "Total stock today + current supplier orders. What you already have or have bought.",
  shortfall: "Required − cover. Positive means you are short; that is the proposed buy.",
  proposedBuy: "Units FileMaker wants you to buy to close the shortfall.",
  nowInService: "Units of this item on hire right now.",
  poCover: "Waiting customer POs timed to the peak month, as a % of that month’s forecast OUT starts. ≥70% treat the ask as firm; 40–70% mixed; under 40% go easier.",
  firmWaiting: "All waiting customer POs converted to this item’s units (waiting × avg LM/hire × qty/m). The whole pipeline, not one month.",
  peakOut: "Forecast units going to new sites in the peak month (LM × qty/m).",
  conversionDays: "Average days from customer PO date raised to on hire, weighted by firm units. Used to time waiting POs onto the graph.",
  weightedDays: "Customer-weighted hire duration on this item now (large clients move the number more).",
  priorWeighted: "Same weighted hire duration in the previous Sales Forecast month.",
  daysChange: "Change in weighted hire days versus last forecast. Longer means stock stays out and less comes back to install again.",
  extraHeld: "Extra units held (or released) because duration changed: peak starts × change in days ÷ working days.",
  outStarts: "Forecast site starts that month, in this item’s units (LM × qty/m).",
  inReturning: "Forecast units coming off hire that month.",
  netHeld: "OUT − IN. Extra stock the fleet must hold that month. Negative (purple) means more is returning than starting.",
  netReleased: "IN greater than OUT — stock coming back, not extra held.",
  projectedIS: "Projected in-service if the monthly OUT/IN path is followed.",
  poBacked: "Waiting customer POs converted to this item’s units and timed to expected hire month (date raised + that builder’s avg days).",
  requiredLine: "Dashed line: fleet required at target utilisation.",
  coverLine: "Dashed line: total stock + current orders you already have.",
  workingDays: "Working days in that forecast month.",
  hires: "Number of forecast hire contracts starting that month.",
  outLm: "Forecast lineal metres going out.",
  netLm: "OUT LM − IN LM.",
  qtyM: "How many of this item are used per lineal metre on that hire product.",
  priorRate: "Qty per metre on last month’s calculator.",
  rateChange: "Change in qty/m versus last month. Up means more of this item per job.",
  daysNow: "Customer-weighted hire days on this product in the current forecast.",
  daysWas: "Same measure in the prior Sales Forecast.",
  deltaDays: "Change in hire days. Red / longer increases the ask.",
  peakOutUnits: "This item’s units on that product in the peak month.",
  peakHires: "Hire contracts on that product in the peak month.",
  latestPo: "Most recent real customer PO on this builder (placeholders like AWAITING are skipped).",
  poCount: "Customer contracts with a real PO in the last 12 months on this item’s hire products.",
  contracts: "All live contracts for this builder on this item’s hire products (last 12 months).",
  waiting: "POs raised but not yet on hire — contracted starts still in the pipeline.",
  firmUnits: "Waiting POs × this builder’s avg LM/hire × this item’s qty/m.",
  avgDaysHire: "This builder’s average days from PO raised to on hire.",
  avgLm: "Average lineal metres per hire for this builder on the peak month.",
  thisItemUnits: "This builder’s peak-month OUT for this item (LM × qty/m).",
  extraHeldRow: "Extra units of this item held because this customer × product lengthened (or released if shortened).",
  staleNever: "Items with no stocktake in the flag window, or never counted, as at the forecast cache date.",
  neverCounted: "Items with no LastStocktake date in FileMaker.",
  onAskStale: "Items that are on this month’s buy ask and also stale or never counted.",
  countedWindow: "Items counted inside the flag window before the forecast cache date.",
  allItems: "Every SKU in this state’s StockCalculator file.",
  withDate: "Items that have at least one LastStocktake date.",
  lastStocktake: "Newest FileMaker LocationItem last-stocktake date for this item.",
  oldestBranch: "Oldest branch last-stocktake date — the weakest count.",
  daysBefore: "Days between the last stocktake and the forecast cache date. Larger = staler at forecast time.",
  stockStatus: "Whether the count was fresh, stale, never done, or after the forecast.",
  onAsk: "Proposed buy qty if this item is on the ask.",
  onlyOrders: "Show only SKUs FileMaker wants you to buy. Turn off to see the whole fleet.",
  detailsTab: "National ask grid — stock, surplus, proposed buy, and GM Decision.",
  demandTab: "Why this item is on the ask: forecast starts, POs, hire duration.",
  stocktakesTab: "Last FileMaker stocktake date versus the forecast cache date.",
  timelineForecast: "Sales Forecast as submitted (before Forecast Orders / GM adjustments). Family units = submitted LM × each item’s qty/m, then summed.",
  timelineActual: "Actual contracts that went on hire that month, in this family’s units. From FileMaker contract actuals on the Sales Forecast (count × avg LM).",
  timelineVar: "Actual − forecast. Green means more went out than planned; red means the forecast was high.",
  timelineForecastLm: "Submitted forecast lineal metres across hire products that use this family.",
  timelineActualLm: "Actual lineal metres on hire that month.",
  timelineForecastHires: "Forecast hire contract count.",
  timelineActualHires: "Actual hire contract count.",
};

function tipAttr(text, title) {
  if (!text) return "";
  return ` data-tip="${esc(text)}"${title ? ` data-tip-title="${esc(title)}"` : ""}`;
}
function kpiCard(label, val, klass, def, cardClass) {
  return `<div class="card ${cardClass || ""}"${tipAttr(def, label)}><div class="label">${esc(label)}</div><div class="val ${klass || ""}">${val}</div></div>`;
}
function thTip(label, def, left) {
  return `<th class="${left ? "l" : ""}"${tipAttr(def, label)}>${esc(label)}</th>`;
}
function tdTip(html, def, extra, left) {
  return `<td class="${[left ? "l" : "", extra || ""].filter(Boolean).join(" ")}"${tipAttr(def)}>${html}</td>`;
}

(function bindHoverTips() {
  const box = document.getElementById("hover-tip");
  const place = (e) => {
    const pad = 14;
    const w = box.offsetWidth;
    const h = box.offsetHeight;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
    box.style.left = Math.max(8, x) + "px";
    box.style.top = Math.max(8, y) + "px";
  };
  document.addEventListener("pointerover", (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el) {
      box.style.display = "none";
      return;
    }
    const title = el.getAttribute("data-tip-title");
    const body = el.getAttribute("data-tip") || "";
    box.innerHTML = (title ? `<div class="tip-title">${esc(title)}</div>` : "") + esc(body);
    box.style.display = "block";
    place(e);
  });
  document.addEventListener("pointermove", (e) => {
    if (box.style.display === "block") place(e);
  });
  document.addEventListener("pointerout", (e) => {
    if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-tip]")) return;
    if (e.target.closest && e.target.closest("[data-tip]") && e.relatedTarget && e.target.closest("[data-tip]").contains(e.relatedTarget)) return;
    box.style.display = "none";
  });
})();

function pageParams() {
  return new URLSearchParams(location.search);
}

function syncUrl(code) {
  const u = new URL(location.href);
  u.searchParams.set("state", state);
  u.searchParams.set("month", month);
  if (code) u.searchParams.set("code", code);
  else u.searchParams.delete("code");
  history.replaceState(null, "", u.pathname + u.search);
}

async function boot() {
  const params = pageParams();
  const startState = params.get("state");
  const startMonth = params.get("month");
  const startCode = params.get("code") || "";
  const r = await fetch("/api/files");
  const j = await r.json();
  files = j.files || [];
  const qld = files.filter(f => f.state === "QLD");
  if (startState && STATES.includes(startState)) state = startState;
  if (startMonth) month = startMonth;
  else if (qld.length) month = qld[0].month;
  else if (files[0]) { state = files[0].state; month = files[0].month; }
  renderControls();
  await load();
  if (startCode) await openDemand(startCode);
}

function renderControls() {
  $("states").innerHTML = STATES.map(s =>
    `<button data-s="${s}" class="${s===state?"on":""}"${tipAttr("Show Forecast Orders for " + s + ".", s)}>${s}</button>`
  ).join("");
  $("states").onclick = (e) => {
    const s = e.target.dataset.s;
    if (!s) return;
    state = s;
    const avail = files.filter(f => f.state === s);
    if (avail.length && !avail.some(f => f.month === month)) month = avail[0].month;
    renderControls();
    load();
  };
  const months = [...new Set(files.filter(f => f.state === state).map(f => f.month))];
  $("month").innerHTML = months.map(m => `<option ${m===month?"selected":""}>${m}</option>`).join("");
  $("month").onchange = () => { month = $("month").value; load(); };
  $("onlyOrders").className = "btn" + (onlyOrders ? " primary" : "");
  $("onlyOrders").onclick = () => { onlyOrders = !onlyOrders; $("onlyOrders").className = "btn" + (onlyOrders ? " primary" : ""); draw(); };
  $("q").oninput = () => { q = $("q").value.trim().toLowerCase(); draw(); };
  $("export").href = `/api/export.xlsx?state=${state}&month=${month}`;
}

async function load() {
  $("banner").textContent = `Loading ${state} ${month}…`;
  $("grid").innerHTML = "";
  try {
    const r = await fetch(`/api/details?state=${state}&month=${month}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    data = j;
    family = "ALL";
    $("export").href = `/api/export.xlsx?state=${state}&month=${month}`;
    if (view === "stocktakes") await loadStocktakes();
    else draw();
  } catch (e) {
    $("banner").innerHTML = `<span class="err">${e.message}</span>`;
  }
}

async function loadStocktakes() {
  $("view-stocktakes").innerHTML = `<div class="banner">Loading stocktake ages for ${esc(state)} ${esc(month)}…</div>`;
  showView();
  try {
    const r = await fetch(`/api/stocktakes?state=${state}&month=${month}&staleDays=${staleDays}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    stocktakes = j;
    drawStocktakes();
  } catch (e) {
    $("view-stocktakes").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function stockStatusLabel(s) {
  return ({
    stale: "Stale at forecast",
    never: "Never counted",
    fresh: "Counted in window",
    "after-forecast": "Counted after forecast",
    "not-required": "Not required",
    "no-data": "No stocktake date",
  })[s] || s;
}

function drawStocktakes() {
  const d = stocktakes;
  if (!d) return;
  const t = d.totals;
  $("banner").textContent =
    `${state} ${month} · forecast cache ${d.cacheDate || "—"} · stocktake window ${d.staleDays} days` +
    (d.source ? ` · ${d.source}${d.importedAt ? " " + new Date(d.importedAt).toLocaleString("en-AU") : ""}` : "");
  const fams = [{family:"ALL", n:t.items, stale:t.stale, never:t.never}, ...d.families];
  let rows = d.rows.filter((r) => {
    if (family !== "ALL" && r.family !== family) return false;
    if (staleOnly && d.hasData && !(r.status === "stale" || r.status === "never")) return false;
    if (q && !(`${r.code} ${r.name}`.toLowerCase().includes(q))) return false;
    return true;
  });
  rows = rows.slice().sort((a, b) => {
    if (stockSort === "item") return a.code.localeCompare(b.code);
    if (stockSort === "family") return a.family.localeCompare(b.family) || a.code.localeCompare(b.code);
    if (stockSort === "date") return String(a.lastStocktake || "").localeCompare(String(b.lastStocktake || "")) || a.code.localeCompare(b.code);
    const rank = { never: 0, stale: 1, "after-forecast": 2, "no-data": 3, "not-required": 4, fresh: 5 };
    const rd = (rank[a.status] ?? 9) - (rank[b.status] ?? 9);
    if (rd) return rd;
    return (b.daysBeforeForecast ?? 9999) - (a.daysBeforeForecast ?? 9999);
  });
  const tone = (s) => s === "stale" || s === "never" ? "neg" : s === "fresh" ? "pos" : "";
  $("view-stocktakes").innerHTML = `
    <div class="why">
      <p>Stocktakes should be done <b>just before the forecast</b>. This flags items that, at cache date <b>${esc(d.cacheDate || "—")}</b>, had no count in the last <b>${d.staleDays} days</b>. ${t.onAskStale ? `<span class="neg">${num(t.onAskStale)} of those are on this month’s ask.</span>` : ""}</p>
      <p class="muted">Dates come from FileMaker LocationItem (LastStocktake). They are not in the StockCalculator JSON. Import a Stocktake List export, or connect Inventory via data/fm.json.</p>
    </div>
    <div class="cards">
      ${kpiCard("Stale / never", num(t.stale), "neg", TIPS.staleNever, "warn")}

function esc(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function clip(s, n) {
  const t = String(s || "");
  return t.length > n ? t.slice(0, n) + "…" : t;
}

async function saveDecision(code, value) {
  await fetch("/api/decisions", {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ state, month, code, decision: value })
  });
  await load();
}

function daysf(n) {
  return n == null || !Number.isFinite(Number(n)) ? "—" : Number(n).toFixed(1);
}
function signed(n, digits) {
  if (n == null || !Number.isFinite(Number(n))) return "—";
  const v = Number(n);
  return (v > 0 ? "+" : "") + v.toFixed(digits);
}

function durationBlock(d) {
  const dur = d.duration || {};
  const peak = d.peakMonth || {};
  const priorLabel = dur.priorMonth || "last forecast";
  const dir = dur.direction || "stable";
  const tone = dir === "longer" ? "warn" : dir === "shorter" ? "good" : "flat";
  const dirWord = dir === "longer" ? "increased" : dir === "shorter" ? "decreased" : "held steady";
  const extra = Math.round(dur.extraUnits || 0);
  const extraAbs = Math.abs(extra);
  let impact = `No prior Sales Forecast (${priorLabel}) to compare hire duration.`;
  if (dur.prior != null && dur.delta != null) {
    const held = dir === "longer"
      ? `About ${num(extraAbs)} extra units of this item stay on hire instead of coming back for the next install — same starts, more fleet, higher ask.`
      : dir === "shorter"
        ? `About ${num(extraAbs)} units come back sooner and can be used again — that eases the ask.`
        : `Duration has not moved enough to change the ask on its own.`;
    impact = `Hire duration has <b>${dirWord}</b> versus ${esc(priorLabel)}. Weighted days are ${daysf(dur.compared != null ? dur.compared : dur.current)} now vs ${daysf(dur.prior)} last forecast (${signed(dur.delta, 1)} days${dur.deltaPct != null ? ", " + signed(dur.deltaPct, 1) + "%" : ""}). ${held}`;
  }
  const moverRows = (rows) => rows && rows.length
    ? rows.map((m) => `<tr>
        ${tdTip(esc(m.company), "Builder whose hire duration moved.", "", true)}
        ${tdTip(esc(m.product), "Hire product this duration is measured on.", "muted", true)}
        ${tdTip(daysf(m.priorDays), TIPS.daysWas)}
        ${tdTip(daysf(m.days), TIPS.daysNow)}
        ${tdTip(signed(m.delta, 0), TIPS.deltaDays, m.delta>0?"neg":"pos")}
        ${tdTip(num(Math.round(m.units)), TIPS.thisItemUnits)}
        ${tdTip(signed(m.extraUnits, 0), TIPS.extraHeldRow, m.extraUnits>0?"neg":"pos")}
      </tr>`).join("")
    : `<tr><td class="l muted" colspan="7">None over 1 day</td></tr>`;
  const moverHead = `<thead><tr>
    ${thTip("Customer", "Builder whose hire duration moved.", true)}
    ${thTip("Product", "Hire product this duration is measured on.", true)}
    ${thTip("Was", TIPS.daysWas)}${thTip("Now", TIPS.daysNow)}
    ${thTip("Δ days", TIPS.deltaDays)}${thTip("Peak units", TIPS.thisItemUnits)}${thTip("Extra held", TIPS.extraHeldRow)}
  </tr></thead>`;
  return `
    <h2>Hire duration — stock staying out</h2>
    <p class="muted">Weighted by each customer’s peak-month units of this item (LM × qty/m), so large clients move the signal. Compared on the same customer × product set as ${esc(priorLabel)}. Extra held = this month’s starts × change in days ÷ working days (${dur.workingDays || "—"}) — stock that does not come back to install again.</p>
    <div class="cards">
      ${kpiCard("Weighted days now", daysf(dur.compared != null ? dur.compared : dur.current), "", TIPS.weightedDays, tone)}
      ${kpiCard(priorLabel + " weighted", daysf(dur.prior), "", TIPS.priorWeighted)}
      ${kpiCard("Change", signed(dur.delta, 1) + "d", dur.delta>0?"neg":dur.delta<0?"pos":"", TIPS.daysChange, tone)}
      ${kpiCard(dir === "shorter" ? "Units released" : "Extra units held", extra ? signed(extra, 0) : "—", extra>0?"neg":extra<0?"pos":"", TIPS.extraHeld, tone)}
    </div>
    <div class="why ${tone === "warn" ? "card warn" : tone === "good" ? "card good" : ""}">
      <p>${impact}</p>
    </div>
    <div class="split">
      <div>
        <h2>Lengthening — increases the ask</h2>
        <div class="table-wrap" style="max-height:none">
          <table>${moverHead}<tbody>${moverRows(dur.longer)}</tbody></table>
        </div>
      </div>
      <div>
        <h2>Shortening — eases the ask</h2>
        <div class="table-wrap" style="max-height:none">
          <table>${moverHead}<tbody>${moverRows(dur.shorter)}</tbody></table>
        </div>
      </div>
    </div>`;
}

function mergePoMonths(months, conversion) {
  if (!conversion || !conversion.months) return months || [];
  const map = {};
  for (const m of conversion.months) {
    const key = m.key || String(m.date || "").slice(0, 7);
    if (key) map[key] = m.poUnits || 0;
  }
  return (months || []).map((m) => ({
    ...m,
    poUnits: map[String(m.date || "").slice(0, 7)] || 0,
  }));
}

function firmBlock(d) {
  const c = d.conversion;
  if (!c) return "";
  const tone = c.confidence || "no-data";
  const cover = c.firmPct == null ? "—" : Math.round(c.firmPct * 100) + "%";
  const cardTone = tone === "firm" ? "good" : tone === "mixed" ? "flat" : tone === "soft" ? "warn" : "";
  const sentences = {
    firm: `Waiting POs timed to the peak month already cover <b>${cover}</b> of those starts (${num(Math.round(c.peakPoUnits || 0))} of ${num(Math.round(c.peakOut))} units). The wider pipeline is ${num(Math.round(c.firmUnits))} units still waiting to go on hire. Treat the calculator ask as firm unless stock + on order already covers it.`,
    mixed: `Waiting POs timed to the peak month cover <b>${cover}</b> of those starts (${num(Math.round(c.peakPoUnits || 0))} of ${num(Math.round(c.peakOut))}). Another ${num(Math.round(c.firmUnits))} units sit in the pipeline. Use conversion days (${daysf(c.avgDays)}) to judge timing.`,
    soft: `Waiting POs timed to the peak month cover only <b>${cover}</b> of those starts. Most of the FileMaker ask is still forecast, not yet on a customer PO — go easier on Decision unless duration or cover is already tight. Pipeline waiting: ${num(Math.round(c.firmUnits))} units.`,
    "no-data": "No waiting customer POs matched for this item yet.",
  };
  return `
    <h2>Firm demand vs forecast</h2>
    <p class="muted">Customer POs already raised and not yet on hire, converted to this item’s units (waiting × avg LM/hire × qty/m). Expected hire month = date raised + that builder’s average days to on hire. This does not change the FileMaker formula — it tells you how much of the peak is already contracted.</p>
    <div class="cards">
      ${kpiCard("PO cover of peak", cover, "", TIPS.poCover, cardTone)}
      ${kpiCard("Firm units waiting", num(Math.round(c.firmUnits)), "", TIPS.firmWaiting)}
      ${kpiCard("Peak forecast OUT", num(Math.round(c.peakOut)), "", TIPS.peakOut)}
      ${kpiCard("Conversion days", c.avgDays == null ? "—" : daysf(c.avgDays), "", TIPS.conversionDays)}
    </div>
    <div class="why ${cardTone ? "card " + cardTone : ""}"><p>${sentences[tone] || sentences["no-data"]}</p></div>
  `;
}

function familyTimelineChart(rows) {
  const months = rows || [];
  if (!months.length) return "";
  const W = 760, H = 240;
  const pad = { l: 56, r: 14, t: 18, b: 34 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const vals = months.flatMap((m) => [m.forecastOut || 0, m.actualOut || 0]);
  const max = Math.max(1, ...vals);
  const y = (v) => pad.t + innerH - (Math.max(0, v) / max) * innerH;
  const n = Math.max(1, months.length);
  const gw = innerW / n;
  const barW = Math.max(10, gw / 5);
  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const v = max * (i / 4);
    const yy = y(v);
    grid += `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#2d3845"/>`;
    grid += `<text x="${pad.l-6}" y="${yy+3}" text-anchor="end" fill="#8b98a5" font-size="10">${num(Math.round(v))}</text>`;
  }
  let bars = "";
  months.forEach((m, i) => {
    const cx = pad.l + i * gw + gw / 2;
    const hist = m.role === "history";
    if (hist) bars += `<rect x="${cx-gw/2+4}" y="${pad.t}" width="${gw-8}" height="${innerH}" fill="rgba(63,185,80,.06)"/>`;
    const f = m.forecastOut || 0;
    const a = m.actualOut || 0;
    if (hist) {
      bars += `<rect x="${cx-barW-2}" y="${y(f)}" width="${barW}" height="${Math.max(0, y(0)-y(f))}" fill="#4f9cf9" rx="2"/>`;
      bars += `<rect x="${cx+2}" y="${y(a)}" width="${barW}" height="${Math.max(0, y(0)-y(a))}" fill="#3fb950" rx="2"/>`;
    } else {
      bars += `<rect x="${cx-barW/2}" y="${y(f)}" width="${barW}" height="${Math.max(0, y(0)-y(f))}" fill="#79b8ff" rx="2"/>`;
    }
    const label = (m.key || m.date || "").slice(0, 7) || ("M" + (i + 1));
    bars += `<text x="${cx}" y="${H-12}" text-anchor="middle" fill="${hist?"#3fb950":"#8b98a5"}" font-size="11">${esc(label)}${hist?" · act":""}</text>`;
  });
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}</svg>
    <div class="legend">
      <span${tipAttr(TIPS.timelineForecast, "Sales Forecast submitted")}><i class="sw" style="background:#4f9cf9"></i>Sales Forecast submitted</span>
      <span${tipAttr(TIPS.timelineActual, "Actual")}><i class="sw" style="background:#3fb950"></i>Actual (on hire)</span>
      <span${tipAttr("Next four months from the submitted Sales Forecast — not Forecast Orders.", "Forward Sales Forecast")}><i class="sw" style="background:#79b8ff"></i>Forward Sales Forecast</span>
    </div>
  </div>`;
}

function familyTimelineBlock(fam) {
  const rows = fam.timeline || [];
  if (!rows.length) return "";
  return `
    <h2>6-month timeline — actual vs submitted Sales Forecast</h2>
    <p class="muted">This is the Sales Forecast as submitted, not Forecast Orders (GM-adjusted). Last two months: submitted SF versus actual on hire. Next four months: submitted SF. ${fam.timelineStates && fam.timelineStates.length ? "States included: " + esc(fam.timelineStates.join(", ")) + "." : ""} Units = submitted LM × each item’s qty/m, then summed across ${esc(fam.name)}. December uses FileMaker’s LM override only if submitted LM is blank.</p>
    ${familyTimelineChart(rows)}
    <div class="table-wrap" style="max-height:none">
      <table>
        <thead><tr>
          ${thTip("Month", "History months are complete. Forward months are this forecast.", true)}
          ${thTip("Type", "History = actual available. Forecast = forward look only.", true)}
          ${thTip("Forecast units", TIPS.timelineForecast)}
          ${thTip("Actual units", TIPS.timelineActual)}
          ${thTip("Variance", TIPS.timelineVar)}
          ${thTip("Forecast LM", TIPS.timelineForecastLm)}
          ${thTip("Actual LM", TIPS.timelineActualLm)}
          ${thTip("Forecast hires", TIPS.timelineForecastHires)}
          ${thTip("Actual hires", TIPS.timelineActualHires)}
        </tr></thead>
        <tbody>${rows.map((m) => {
          const hist = m.role === "history";
          return `<tr class="${hist?"order":""}">
            ${tdTip(esc(m.key || (m.date||"").slice(0,7)), "Calendar month on the Sales Forecast.", "", true)}
            ${tdTip(hist ? "Actual + forecast" : "Forecast", hist ? "Completed month with actuals." : "Forward forecast month.", "", true)}
            ${tdTip(num(Math.round(m.forecastOut || 0)), TIPS.timelineForecast)}
            ${tdTip(hist ? num(Math.round(m.actualOut || 0)) : "—", TIPS.timelineActual)}
            ${tdTip(hist ? signed(m.variance, 0) : "—", TIPS.timelineVar, hist ? cls(m.variance) : "")}
            ${tdTip(num(Math.round(m.forecastLm || 0)), TIPS.timelineForecastLm)}
            ${tdTip(hist ? num(Math.round(m.actualLm || 0)) : "—", TIPS.timelineActualLm)}
            ${tdTip(num(Math.round(m.forecastHires || 0)), TIPS.timelineForecastHires)}
            ${tdTip(hist ? num(Math.round(m.actualHires || 0)) : "—", TIPS.timelineActualHires)}
          </tr>`;
        }).join("")}</tbody>
      </table>
    </div>`;
}

function demandChart(months, refs) {
  const W = 760, H = 240;
  const pad = { l: 56, r: 14, t: 18, b: 34 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const vals = (months || []).flatMap((m) => [m.outUnits || 0, m.inUnits || 0, Math.abs(m.netUnits || 0), m.projectedInService || 0, m.poUnits || 0]);
  if (refs) {
    if (refs.required) vals.push(refs.required);
    if (refs.forecastMax) vals.push(refs.forecastMax);
    if (refs.cover) vals.push(refs.cover);
  }
  const max = Math.max(1, ...vals);
  const y = (v) => pad.t + innerH - (Math.max(0, v) / max) * innerH;
  const n = Math.max(1, (months || []).length);
  const gw = innerW / n;
  const barW = Math.max(8, gw / 6);
  const ticks = 4;
  let grid = "";
  for (let i = 0; i <= ticks; i++) {
    const v = max * (i / ticks);
    const yy = y(v);
    grid += `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#2d3845"/>`;
    grid += `<text x="${pad.l-6}" y="${yy+3}" text-anchor="end" fill="#8b98a5" font-size="10">${num(Math.round(v))}</text>`;
  }
  let bars = "";
  let linePts = [];
  let poPts = [];
  (months || []).forEach((m, i) => {
    const cx = pad.l + i * gw + gw / 2;
    const peak = refs && refs.peakIndex === m.index;
    if (peak) bars += `<rect x="${cx-gw/2+4}" y="${pad.t}" width="${gw-8}" height="${innerH}" fill="rgba(79,156,249,.08)"/>`;
    const out = m.outUnits || 0;
    const inn = m.inUnits || 0;
    const net = m.netUnits || 0;
    bars += `<rect x="${cx-barW*1.6}" y="${y(out)}" width="${barW}" height="${Math.max(0, y(0)-y(out))}" fill="#4f9cf9" rx="2"/>`;
    bars += `<rect x="${cx-barW*0.5}" y="${y(inn)}" width="${barW}" height="${Math.max(0, y(0)-y(inn))}" fill="#3fb950" rx="2"/>`;
    const netFill = net >= 0 ? "#f85149" : "#a371f7";
    bars += `<rect x="${cx+barW*0.6}" y="${y(Math.abs(net))}" width="${barW}" height="${Math.max(0, y(0)-y(Math.abs(net)))}" fill="${netFill}" rx="2"/>`;
    if (net < 0 && Math.abs(net) > 0) {
      bars += `<text x="${cx+barW*1.1}" y="${y(Math.abs(net))-4}" text-anchor="middle" fill="#a371f7" font-size="9">${signed(net, 0)}</text>`;
    }
    const label = (m.date || "").slice(0, 7) || ("M" + m.index);
    bars += `<text x="${cx}" y="${H-12}" text-anchor="middle" fill="${peak?"#4f9cf9":"#8b98a5"}" font-size="11">${esc(label)}${peak?" · peak":""}</text>`;
    linePts.push(`${cx},${y(m.projectedInService || 0)}`);
    if (m.poUnits) poPts.push(`${cx},${y(m.poUnits)}`);
  });
  let refsSvg = "";
  const dash = (value, color) => {
    if (!value) return "";
    const yy = y(value);
    return `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="${color}" stroke-dasharray="5 4" stroke-width="1.2"/>`;
  };
  if (refs) {
    refsSvg += dash(refs.required, "#f85149");
    refsSvg += dash(refs.cover, "#8b98a5");
  }
  const dots = (months || []).map((m, i) => {
    const cx = pad.l + i * gw + gw / 2;
    return `<circle cx="${cx}" cy="${y(m.projectedInService || 0)}" r="3.5" fill="#d29922"/>`;
  }).join("");
  const poDots = (months || []).map((m, i) => {
    if (!m.poUnits) return "";
    const cx = pad.l + i * gw + gw / 2;
    return `<circle cx="${cx}" cy="${y(m.poUnits)}" r="4" fill="#39d0d8"/>`;
  }).join("");
  const poLine = poPts.length
    ? `<polyline fill="none" stroke="#39d0d8" stroke-width="2" stroke-dasharray="4 3" points="${poPts.join(" ")}"/>`
    : "";
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}${refsSvg}
      <polyline fill="none" stroke="#d29922" stroke-width="2" points="${linePts.join(" ")}"/>${dots}
      ${poLine}${poDots}
    </svg>
    <div class="legend">
      <span${tipAttr(TIPS.outStarts, "OUT starts")}><i class="sw" style="background:#4f9cf9"></i>OUT starts</span>
      <span${tipAttr(TIPS.inReturning, "IN returning")}><i class="sw" style="background:#3fb950"></i>IN returning</span>
      <span${tipAttr(TIPS.netHeld, "NET extra held")}><i class="sw" style="background:#f85149"></i>NET extra held</span>
      <span${tipAttr(TIPS.netReleased, "NET released")}><i class="sw" style="background:#a371f7"></i>NET released (IN &gt; OUT)</span>
      <span${tipAttr(TIPS.projectedIS, "Projected in service")}><i class="sw" style="background:#d29922"></i>Projected in service</span>
      <span${tipAttr(TIPS.poBacked, "PO-backed starts")}><i class="sw" style="background:#39d0d8"></i>PO-backed starts</span>
      <span${tipAttr(TIPS.requiredLine, "Required")}><i class="sw" style="background:transparent;border:1px dashed #f85149"></i>Required</span>
      <span${tipAttr(TIPS.coverLine, "Stock + on order")}><i class="sw" style="background:transparent;border:1px dashed #8b98a5"></i>Stock + on order</span>
    </div>
  </div>`;
}

function drawDemand() {
  const d = demand;
  const it = d.item;
  const fam = d.family || {};
  const familyMode = demandScope === "family" && fam.name;
  const peak = (familyMode ? fam.peakMonth : d.peakMonth) || {};
  const months = mergePoMonths(familyMode ? (fam.months || []) : d.months, familyMode ? null : d.conversion);
  const peakLabel = peak.date ? peak.date.slice(0, 7) : `Month ${peak.index}`;
  const why = familyMode
    ? `${esc(fam.name)} is ${num(fam.itemCount)} items. Combined forecast peak in-service is ${num(fam.forecastMax)}. Required at each item’s target is ${num(fam.required)}. Stock + on order cover ${num(fam.cover)}, shortfall ${num(fam.shortfall)}. Proposed buy across the family is ${fam.orderQty ? num(fam.orderQty) + " units · " + aud(fam.orderCost) : "none"} (${num(fam.orderLines)} order lines).`
    : (it.orderQty > 0
      ? `${it.code} is on the ask because forecast peak in-service is ${num(it.forecastMax)} units. At ${pct(it.targetUtil)} target utilisation you need ${num(d.required)} in the fleet. You have ${num(it.totalStock)} today plus ${num(it.currentOrders)} already on order (${num(d.cover)}). That leaves a shortfall of ${num(d.shortfall)}, so the calculator proposes buying ${num(it.orderQty)}.`
      : `${it.code} is not on the ask. Forecast peak in-service ${num(it.forecastMax)} at ${pct(it.targetUtil)} needs ${num(d.required)}; stock + current orders cover ${num(d.cover)}.`);
  const peakWhy = peak.outUnits
    ? ` Strongest new-site demand in this forecast is ${peakLabel}: ${num(Math.round(peak.outUnits))} units going to site, ${num(Math.round(peak.inUnits || 0))} returning, net ${num(Math.round(peak.netUnits || 0))}.`
    : "";
  const dur = d.duration || {};
  const durWhy = !familyMode && dur.delta != null && Math.abs(dur.delta) >= 0.5
    ? ` Hire duration has ${dur.direction === "longer" ? "increased" : "decreased"} ${signed(dur.delta, 1)} days versus ${esc(dur.priorMonth || "last forecast")} (weighted by customer size). ${dur.direction === "longer" ? "Stock is staying out longer, so less comes back to install again." : "Jobs are turning faster, so more stock comes back."}`
    : "";
  const kpis = familyMode
    ? [
        ["Forecast max IS", num(fam.forecastMax), "", TIPS.forecastMax],
        ["Required at target", num(fam.required), "", TIPS.required],
        ["Total + on order", num(fam.cover), "", TIPS.cover],
        ["Shortfall", num(fam.shortfall), cls(-fam.shortfall), TIPS.shortfall],
        ["Proposed buy", fam.orderQty ? num(fam.orderQty) : "—", "", TIPS.proposedBuy],
        ["Now in service", num(fam.inService), "", TIPS.nowInService],
      ]
    : [
        ["Forecast max IS", num(it.forecastMax), "", TIPS.forecastMax],
        ["Required at target", num(d.required), "", TIPS.required],
        ["Total + on order", num(d.cover), "", TIPS.cover],
        ["Shortfall", num(d.shortfall), cls(-d.shortfall), TIPS.shortfall],
        ["Proposed buy", it.orderQty ? num(it.orderQty) : "—", "", TIPS.proposedBuy],
        ["Now in service", num(it.inService), "", TIPS.nowInService],
      ];
  const refs = {
    required: familyMode ? fam.required : d.required,
    forecastMax: familyMode ? fam.forecastMax : it.forecastMax,
    cover: familyMode ? fam.cover : d.cover,
    peakIndex: peak.index,
  };

  $("view-demand").innerHTML = `
    <div class="demand-head">
      <div class="seg" id="demandScope">
        <button data-scope="item" class="${familyMode?"":"on"}">${esc(it.code)}</button>
        <button data-scope="family" class="${familyMode?"on":""}">${esc(it.family || "Family")}${fam.itemCount ? " · " + fam.itemCount : ""}</button>
      </div>
    </div>
    <div class="why">
      <p><b>${familyMode ? esc(fam.name) : esc(it.code)}</b> · ${familyMode ? num(fam.itemCount) + " items" : esc(it.name) + " · " + esc(it.family)}</p>
      <p>${why}${peakWhy}${durWhy}</p>
      <p class="muted">${familyMode ? "Family totals sum each item’s units (LM × that item’s qty/m). Hires are not summed — the same job uses many items." : esc(d.note)} Source ${esc(d.sfFile)}${d.sfExport ? " · " + esc(d.sfExport) : ""}.</p>
    </div>
    <div class="cards">
      ${kpis.map(([label, val, klass, def]) => kpiCard(label, val, klass, def)).join("")}
    </div>
    ${familyMode ? familyTimelineBlock(fam) : firmBlock(d)}
    <h2>Demand over the forecast period</h2>
    <p class="muted">${familyMode ? "All items in " + esc(fam.name) : esc(it.code)} — starts, returning stock, net extra held, and projected in-service versus required / cover.${familyMode ? "" : " Cyan line is waiting customer POs timed to expected hire month."}</p>
    ${demandChart(months, refs)}
    ${familyMode ? "" : durationBlock(d)}
    <h2>Monthly starts vs returning</h2>
    <p class="muted">OUT = forecasted site starts (LM × qty/m). IN = returning contracts. NET = extra stock the fleet must hold that month.</p>
    <div class="table-wrap" style="max-height:none">
      <table>
        <thead><tr>
          ${thTip("Month", "Forecast month. Peak is the strongest new-site starts.", true)}
          ${thTip("Working days", TIPS.workingDays)}
          ${familyMode ? "" : thTip("Hires", TIPS.hires)}
          ${thTip("OUT units", TIPS.outStarts)}
          ${familyMode ? "" : thTip("PO-backed", TIPS.poBacked)}
          ${thTip("IN units", TIPS.inReturning)}
          ${thTip("NET units", TIPS.netHeld)}
          ${thTip("Projected IS", TIPS.projectedIS)}
          ${familyMode ? "" : thTip("OUT LM", TIPS.outLm) + thTip("NET LM", TIPS.netLm)}
        </tr></thead>
        <tbody>${months.map(m => `
          <tr class="${m.index===peak.index?"order":""}">
            ${tdTip(esc((m.date||"").slice(0,7) || ("M"+m.index)) + (m.index===peak.index?" · peak starts":""), "Forecast month. Peak is the strongest new-site starts.", "", true)}
            ${tdTip(m.workingDays||"—", TIPS.workingDays)}
            ${familyMode ? "" : tdTip(num(m.hires), TIPS.hires)}
            ${tdTip(num(Math.round(m.outUnits)), TIPS.outStarts)}
            ${familyMode ? "" : tdTip(m.poUnits ? num(Math.round(m.poUnits)) : "—", TIPS.poBacked)}
            ${tdTip(num(Math.round(m.inUnits)), TIPS.inReturning)}
            ${tdTip(num(Math.round(m.netUnits)), TIPS.netHeld, cls(m.netUnits))}
            ${tdTip(num(Math.round(m.projectedInService)), TIPS.projectedIS)}
            ${familyMode ? "" : tdTip(num(Math.round(m.outLm)), TIPS.outLm) + tdTip(num(Math.round(m.netLm)), TIPS.netLm, cls(m.netLm))}
          </tr>`).join("")}</tbody>
      </table>
    </div>
    ${familyMode ? `
    <h2>Items in ${esc(fam.name)}</h2>
    <p class="muted">Click an item to open its own demand. Sorted by proposed buy, then peak starts.</p>
    <div class="table-wrap" style="max-height:none">
      <table>
        <thead><tr>
          ${thTip("Item", TIPS.item, true)}${thTip("Forecast max", TIPS.forecastMax)}${thTip("Required", TIPS.required)}${thTip("Cover", TIPS.cover)}
          ${thTip("Shortfall", TIPS.shortfall)}${thTip("Proposed buy", TIPS.proposedBuy)}${thTip("Buy $", TIPS.orderCost)}
          ${thTip("Peak OUT", TIPS.peakOut)}${thTip("Now IS", TIPS.nowInService)}${thTip("Total stock", TIPS.totalStock)}
        </tr></thead>
        <tbody>${(fam.members||[]).map(m => `
          <tr class="clickable ${m.code===it.code?"order":""}" data-code="${esc(m.code)}">
            ${tdTip(`<b>${esc(m.code)}</b><div class="muted">${esc(clip(m.name,15))}</div>`, TIPS.item, "", true)}
            ${tdTip(num(m.forecastMax), TIPS.forecastMax)}
            ${tdTip(num(m.required), TIPS.required)}
            ${tdTip(num(m.cover), TIPS.cover)}
            ${tdTip(num(m.shortfall), TIPS.shortfall, cls(-m.shortfall))}
            ${tdTip(m.orderQty?num(m.orderQty):"", TIPS.proposedBuy)}
            ${tdTip(m.orderCost?aud(m.orderCost):"", TIPS.orderCost)}
            ${tdTip(num(Math.round(m.peakOut)), TIPS.peakOut)}
            ${tdTip(num(m.inService), TIPS.nowInService)}
            ${tdTip(`<b>${num(m.totalStock)}</b>`, TIPS.totalStock)}
          </tr>`).join("")}</tbody>
      </table>
    </div>` : `
    <h2>Where this item is used (qty per metre)</h2>
    <p class="muted">Frequency of use on each hire product. Rate change vs last month’s calculator if available. Days are customer-weighted on this product.</p>
    <div class="table-wrap" style="max-height:none">
      <table>
        <thead><tr>
          ${thTip("Product", "Hire product that uses this item.", true)}
          ${thTip("Qty / m", TIPS.qtyM)}${thTip("Prior month", TIPS.priorRate)}${thTip("Change", TIPS.rateChange)}
          ${thTip("Days now", TIPS.daysNow)}${thTip("Days was", TIPS.daysWas)}${thTip("Δ days", TIPS.deltaDays)}
          ${thTip("Peak OUT units", TIPS.peakOutUnits)}${thTip("Peak hires", TIPS.peakHires)}
        </tr></thead>
        <tbody>${d.products.map(p => {
          const pm = p.months[peak.index-1] || p.months[0] || {};
          const ch = p.rateDelta == null ? "—" : ((p.rateDelta>0?"+":"")+p.rateDelta.toFixed(4));
          const pd = (dur.byProduct || []).find(x => x.code === p.code) || {};
          return `<tr>
            ${tdTip(`<b>${esc(p.code)}</b><div class="muted">${esc(p.name)}</div>`, "Hire product that uses this item.", "", true)}
            ${tdTip(p.rate.toFixed(4), TIPS.qtyM)}
            ${tdTip(p.priorRate==null?"—":p.priorRate.toFixed(4), TIPS.priorRate)}
            ${tdTip(ch, TIPS.rateChange, p.rateDelta>0?"neg":p.rateDelta<0?"pos":"")}
            ${tdTip(daysf(pd.days), TIPS.daysNow)}
            ${tdTip(daysf(pd.priorDays), TIPS.daysWas)}
            ${tdTip(signed(pd.delta, 1), TIPS.deltaDays, pd.delta>0?"neg":pd.delta<0?"pos":"")}
            ${tdTip(num(Math.round(pm.outUnits||0)), TIPS.peakOutUnits)}
            ${tdTip(num(pm.hires||0), TIPS.peakHires)}
          </tr>`;
        }).join("")}</tbody>
      </table>
    </div>
    <h2>Customers driving ${esc(peakLabel)} starts</h2>
    <p class="muted">Days weighted by that customer’s peak LM. Units = forecast LM × this item’s qty/m. Firm units = waiting POs × avg LM/hire × qty/m. ${esc(d.poSource || "Customer POs from live ERP.")} Waiting = PO raised, not yet on hire.</p>
    <div class="table-wrap" style="max-height:none">
      <table>
        <thead><tr>
          ${thTip("Company", "Customer driving peak-month starts.", true)}
          ${thTip("AM", "Account manager on that customer.", true)}
          ${thTip("Latest PO", TIPS.latestPo, true)}
          ${thTip("POs", TIPS.poCount)}${thTip("Contracts", TIPS.contracts)}
          ${thTip("Waiting", TIPS.waiting)}${thTip("Firm units", TIPS.firmUnits)}
          ${thTip("Avg days to on hire", TIPS.avgDaysHire)}
          ${thTip("Days now", TIPS.daysNow)}${thTip("Days was", TIPS.daysWas)}${thTip("Δ days", TIPS.deltaDays)}
          ${thTip("Avg LM/hire", TIPS.avgLm)}
          ${thTip("Hires", TIPS.hires)}${thTip("OUT LM", TIPS.outLm)}${thTip("NET LM", TIPS.netLm)}${thTip("This item units", TIPS.thisItemUnits)}
        </tr></thead>
        <tbody>${d.companies.map(c => {
          const po = c.po || {};
          const poTitle = (po.poNumbers || []).join(", ");
          return `<tr>
            ${tdTip(esc(c.company), "Customer driving peak-month starts.", "", true)}
            ${tdTip(esc(c.manager), "Account manager on that customer.", "muted", true)}
            ${tdTip(esc(po.latestPo || "—") + (po.latestRaised ? `<div class="muted">${esc(po.latestRaised)}</div>` : ""), TIPS.latestPo + (poTitle ? " " + poTitle : ""), "", true)}
            ${tdTip(po.withPo != null ? num(po.withPo) : "—", TIPS.poCount)}
            ${tdTip(po.contracts != null ? num(po.contracts) : "—", TIPS.contracts)}
            ${tdTip(po.waiting ? num(po.waiting) : "—", TIPS.waiting, po.waiting>0?"neg":"")}
            ${tdTip(c.firmUnits ? num(Math.round(c.firmUnits)) : "—", TIPS.firmUnits)}
            ${tdTip(po.avgDays==null?"—":daysf(po.avgDays), TIPS.avgDaysHire)}
            ${tdTip(c.avgDays?daysf(c.avgDays):"—", TIPS.daysNow)}
            ${tdTip(daysf(c.priorDays), TIPS.daysWas)}
            ${tdTip(signed(c.daysDelta, 1), TIPS.deltaDays, c.daysDelta>0?"neg":c.daysDelta<0?"pos":"")}
            ${tdTip(c.avgQty?c.avgQty.toFixed(1):"—", TIPS.avgLm)}
            ${tdTip(num(c.hires), TIPS.hires)}
            ${tdTip(num(Math.round(c.outLm)), TIPS.outLm)}
            ${tdTip(num(Math.round(c.netLm)), TIPS.netLm, cls(c.netLm))}
            ${tdTip(`<b>${num(Math.round(c.units))}</b>`, TIPS.thisItemUnits)}
          </tr>`;
        }).join("")}</tbody>
      </table>
    </div>`}`;
  $("demandScope").onclick = (e) => {
    const s = e.target.dataset.scope;
    if (!s || s === demandScope) return;
    demandScope = s;
    drawDemand();
  };
  $("view-demand").querySelectorAll("tr[data-code]").forEach((tr) => {
    tr.addEventListener("click", () => openDemand(tr.dataset.code));
  });
}

boot().catch(e => { $("banner").innerHTML = `<span class="err">${e.message}</span>`; });
</script>
</body>
</html>
