<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Review</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2129; --panel2:#222b35; --border:#2d3845;
    --text:#e6edf3; --muted:#8b98a5; --accent:#4f9cf9;
    --green:#3fb950; --greenbg:rgba(63,185,80,.12);
    --red:#f85149; --redbg:rgba(248,81,73,.12); --amber:#d29922; --amberbg:rgba(210,153,34,.12);
    --cyan:#39d0d8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
  header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
  header h1{margin:0;font-size:18px;font-weight:650}
  header .sub{color:var(--muted);font-size:12px;margin-top:3px}
  .wrap{padding:14px 24px 48px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button,.btn,select,input[type=search]{
    font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 12px
  }
  .seg button{border:0;border-radius:0;cursor:pointer}
  .seg button.on{background:var(--accent);color:#08111f;font-weight:650}
  .btn{cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#08111f;border-color:var(--accent);font-weight:650}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
  .card .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .card .val{font-size:20px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
  .val.green{color:var(--green)} .val.red{color:var(--red)}
  .banner{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--muted);font-size:12px;margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
  .chip{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;font:inherit}
  .chip.on{background:rgba(79,156,249,.18);border-color:var(--accent);color:var(--accent);font-weight:600}
  .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel);max-height:calc(100vh - 340px)}
  table{border-collapse:collapse;width:100%;min-width:1680px}
  .stocktakes table,.national-grid table{min-width:1100px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-size:11px;font-weight:650;text-align:right;z-index:1}
  th.l,td.l{text-align:left}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--text)}
  th.sortable.on{color:var(--accent)}
  th.sortable .sort-mark{font-size:10px;margin-left:3px;opacity:.85}
  tbody tr:hover{background:rgba(79,156,249,.06)}
  tbody tr.order{background:rgba(79,156,249,.04)}
  tbody tr.picked{background:rgba(79,156,249,.16)}
  tbody tr.clickable{cursor:pointer}
  th.pick,td.pick{width:28px;text-align:center;padding-left:6px;padding-right:6px}
  .pick-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
  .tabs{display:flex;gap:6px;margin:0 0 12px}
  .tabs button{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;font:inherit}
  .tabs button.on{background:var(--accent);color:#08111f;font-weight:650}
  .tabs button:disabled{opacity:.4;cursor:not-allowed}
  .why{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .why p{margin:0 0 8px;line-height:1.45}
  .why p:last-child{margin-bottom:0}
  .why code{font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px}
  h2{font-size:14px;font-weight:650;margin:18px 0 8px}
  .neg{color:var(--red)} .pos{color:var(--green)}
  td input.dec{
    width:78px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);
    background:#0f1419;color:var(--text);text-align:right;font:inherit
  }
  .muted{color:var(--muted)}
  .err{color:var(--red);padding:20px}
  .totals{margin-top:16px;overflow:auto}
  .totals table{min-width:520px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .duration-tables table{min-width:820px}
  .duration-tables tfoot td{font-weight:650;background:var(--panel2);border-top:1px solid var(--border)}
  .duration-net{margin:8px 0 0;font-size:12px;line-height:1.45}
  @media (max-width:900px){.split{grid-template-columns:1fr}}
  .card.warn{border-color:rgba(248,81,73,.45);background:rgba(248,81,73,.08)}
  .card.good{border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.08)}
  .card.flat{border-color:rgba(210,153,34,.45);background:rgba(210,153,34,.08)}
  .chart{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px 8px;margin:12px 0}
  .chart svg{width:100%;height:240px;display:block}
  .chart .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;color:var(--muted);font-size:11px}
  .chart .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .demand-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 8px}
  .chart-head h2{margin:0}
  [data-tip]{cursor:help}
  #hover-tip{
    position:fixed;z-index:9999;max-width:340px;pointer-events:none;
    background:#141c24;border:1px solid var(--accent);border-radius:8px;
    padding:8px 11px;box-shadow:0 10px 28px rgba(0,0,0,.5);
    color:var(--text);font-size:12px;line-height:1.4;display:none
  }
  #hover-tip .tip-title{color:var(--accent);font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Stock Review</h1>
    <div class="sub" id="headerSub">Buy ask is the last forecast month only (Dec 2026 on a Sep 2026 file). Peak months are highlighted for ops / transfers — not a dollar ask. Decision is the GM override.</div>
  </div>
  <div class="row">
    <div class="seg" id="states"></div>
    <div class="seg" id="askBasis" data-tip-title="Ask basis" data-tip="Buy month = last forecast month in-service (what you can still purchase). Peak month = FileMaker Peak IS / Forecast Max (often October — too late to buy). Surplus and qty follow this toggle."></div>
    <select id="month"></select>
    <button class="btn" id="onlyOrders" data-tip-title="Ask lines only" data-tip="Show only SKUs with a shortfall on the selected ask (buy month or peak month).">Ask lines only</button>
    <input type="search" id="q" placeholder="Search code or name" />
    <a class="btn primary" id="export" href="#" data-tip-title="Export Excel" data-tip="Download this state’s Details grid as an Excel file, including Decision values.">Export Excel</a>
  </div>
</header>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="on" data-view="details" data-tip-title="Details" data-tip="Buy-month shortfall grid — stock, surplus, and GM Decision. Peak is shown for ops, not as a dollar ask.">Details</button>
    <button data-view="demand" id="tabDemand" disabled data-tip-title="Demand" data-tip="Why this item is on the ask: forecast starts, customer POs, and hire duration. Click a row first.">Demand</button>
    <button data-view="stocktakes" data-tip-title="Stocktakes" data-tip="Last FileMaker stocktake date versus the forecast cache date.">Stocktakes</button>
  </div>
  <div class="banner" id="banner">Loading StockCalculator…</div>
  <div id="view-details">
    <div class="cards" id="kpis"></div>
    <div class="chips" id="families"></div>
    <div class="pick-bar" id="pickBar"></div>
    <div class="table-wrap" id="grid"></div>
    <div class="totals" id="totals"></div>
  </div>
  <div id="view-demand" hidden></div>
  <div id="view-stocktakes" hidden></div>
</div>
<div id="hover-tip"></div>
<script>
const STATES = ["QLD","NSW","VIC","SA"];
const NAT = "NAT";
let files = [];
let state = "QLD";
let month = "2026-09";
let data = null;
let family = "ALL";
let askBasis = "buy";
let onlyOrders = true;
let q = "";
let view = "details";
let selectedCode = "";
let demand = null;
let demandScope = "item";
let demandChartMode = "buy";
let pickedCodes = [];
let stocktakes = null;
let staleDays = 14;
let staleOnly = true;
let negOnly = false;
let stockSort = "stale";
let gridSort = { key: "code", dir: "asc" };
const TEXT_SORT = new Set(["code", "family", "peakMonthKey"]);

const $ = (id) => document.getElementById(id);
const aud = (n) => (n||0).toLocaleString("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:0});
const num = (n) => (n||0).toLocaleString("en-AU");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtMonth(v) {
  const s = String(v || "");
  const m = s.match(/^(\d{4})-(\d{2})/);
  if (!m) return s || "—";
  const i = Number(m[2]) - 1;
  return MON[i] ? MON[i] + " " + m[1] : s;
}
function fmtDay(v) {
  const s = String(v || "");
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return fmtMonth(s);
  const i = Number(m[2]) - 1;
  return MON[i] ? Number(m[3]) + " " + MON[i] + " " + m[1] : s;
}
const pct = (n) => n ? (n*100).toFixed(0)+"%" : "—";
const cls = (n) => n < 0 ? "neg" : n > 0 ? "pos" : "";
function isPeakAsk() { return askBasis === "peak"; }
function askQty(r) {
  if (!r) return 0;
  return isPeakAsk() ? (r.peakQty || 0) : (r.buyQty != null ? r.buyQty : r.sysQty || 0);
}
function askCost(r) {
  if (!r) return 0;
  return isPeakAsk() ? (r.peakCost || 0) : (r.buyCost != null ? r.buyCost : r.sysCost || 0);
}
function askSurplus(r) {
  if (!r) return 0;
  return isPeakAsk()
    ? (r.peakSurplus != null ? r.peakSurplus : r.surplus || 0)
    : (r.buySurplus != null ? r.buySurplus : r.surplus || 0);
}
function askQtyState(r, st) {
  const s = (r && r.byState && r.byState[st]) || {};
  return isPeakAsk() ? (s.peakQty || 0) : (s.buyQty != null ? s.buyQty : s.sysQty || 0);
}
function askCostState(r, st) {
  const s = (r && r.byState && r.byState[st]) || {};
  return isPeakAsk() ? (s.peakCost || 0) : (s.buyCost != null ? s.buyCost : s.sysCost || 0);
}
const buyQty = (r) => askQty(r);
const buyCost = (r) => askCost(r);
const onBuy = (r) => askQty(r) > 0;
function askMonthKey(dataObj) {
  const d = dataObj || data || {};
  return isPeakAsk() ? (d.peakMonthKey || "") : (d.buyMonthKey || "");
}
function askNoun() { return isPeakAsk() ? "Peak" : "Buy"; }
function exportHref() {
  return `/api/export.xlsx?state=${state}&month=${month}&ask=${askBasis}`;
}
function summarizeAsk(src) {
  const rows = (src && src.rows) || [];
  const families = {};
  for (const r of rows) {
    const fam = r.family || "(blank)";
    if (!families[fam]) families[fam] = { family: fam, n: 0, orderLines: 0, orderCost: 0, sysCost: 0, decisionCost: 0 };
    families[fam].n += 1;
    if (askQty(r) > 0) {
      families[fam].orderLines += 1;
      families[fam].orderCost += askCost(r);
      families[fam].sysCost += askCost(r);
    }
    families[fam].decisionCost += r.decisionCost || 0;
  }
  const orderRows = rows.filter((r) => askQty(r) > 0);
  const totals = {
    ...(src.totals || {}),
    orderLines: orderRows.length,
    orderQty: orderRows.reduce((s, r) => s + askQty(r), 0),
    orderCost: orderRows.reduce((s, r) => s + askCost(r), 0),
    sysCost: orderRows.reduce((s, r) => s + askCost(r), 0),
    shortfallLines: rows.filter((r) => askSurplus(r) < 0).length,
  };
  let byState = src.byState;
  if (src.national && src.byState) {
    byState = src.byState.map((s) => {
      if (s.missing) return s;
      const stRows = rows.filter((r) => r.byState && r.byState[s.state]);
      const qty = stRows.reduce((sum, r) => sum + askQtyState(r, s.state), 0);
      const cost = stRows.reduce((sum, r) => sum + askCostState(r, s.state), 0);
      return {
        ...s,
        orderLines: stRows.filter((r) => askQtyState(r, s.state) > 0).length,
        orderQty: qty,
        orderCost: cost,
        sysCost: cost,
      };
    });
  }
  return {
    totals,
    families: Object.values(families).sort((a, b) => b.orderCost - a.orderCost),
    byState,
  };
}
function isPicked(code) {
  return pickedCodes.indexOf(code) >= 0;
}
function setPicked(code, on) {
  if (on) {
    const row = ((data && data.rows) || []).find((r) => r.code === code);
    const famName = row && row.family;
    if (famName && pickedRows().some((r) => r.family !== famName)) pickedCodes = [];
    if (!isPicked(code)) pickedCodes.push(code);
  } else {
    pickedCodes = pickedCodes.filter((c) => c !== code);
  }
}
function pickedRows() {
  return ((data && data.rows) || []).filter((r) => isPicked(r.code));
}
function pickedFamilies() {
  return [...new Set(pickedRows().map((r) => r.family).filter(Boolean))];
}
function pickTargetRows(rows) {
  const list = rows || [];
  const current = pickedFamilies()[0] || (family !== "ALL" ? family : (list[0] && list[0].family));
  return current ? list.filter((r) => r.family === current) : list;
}
function rollupFamily(fam, codes) {
  const set = new Set(codes || []);
  const selected = (fam.members || []).filter((m) => set.has(m.code));
  if (!selected.length) {
    return {
      ...fam,
      itemCount: 0,
      orderLines: 0,
      forecastMax: 0,
      required: 0,
      cover: 0,
      shortfall: 0,
      inService: 0,
      totalStock: 0,
      currentOrders: 0,
      orderQty: 0,
      orderCost: 0,
      months: (fam.months || []).map((m) => ({
        ...m,
        hires: 0,
        outUnits: 0,
        inUnits: 0,
        netUnits: 0,
        projectedInService: 0,
        inUnfiled: false,
      })),
      peakMonth: {},
      subset: true,
      subsetCodes: [],
    };
  }
  const months = (fam.months || []).map((m, i) => {
    const slice = {
      index: m.index,
      date: m.date,
      workingDays: m.workingDays,
      hires: 0,
      outUnits: 0,
      inUnits: 0,
      netUnits: 0,
      projectedInService: 0,
      inUnfiled: false,
    };
    let outFiled = 0;
    let outUnfiled = 0;
    for (const mem of selected) {
      const pm = (mem.months || [])[i] || {};
      slice.outUnits += pm.outUnits || 0;
      slice.inUnits += pm.inUnits || 0;
      slice.netUnits += pm.netUnits || 0;
      slice.projectedInService += pm.projectedInService || 0;
      if (pm.inUnfiled) outUnfiled += pm.outUnits || 0;
      else outFiled += pm.outUnits || 0;
    }
    slice.inUnfiled = outUnfiled > 0 && outFiled === 0;
    return slice;
  });
  const peak = months.reduce((a, b) => ((b.outUnits || 0) > (a.outUnits || 0) ? b : a), months[0] || {});
  const required = selected.reduce((s, m) => s + (isPeakAsk() ? (m.peakRequired || 0) : (m.required || 0)), 0);
  const cover = selected.reduce((s, m) => s + (m.cover || 0), 0);
  return {
    ...fam,
    itemCount: selected.length,
    orderLines: selected.filter((m) => askQty(m) > 0).length,
    forecastMax: selected.reduce((s, m) => s + (m.forecastMax || 0), 0),
    required,
    cover,
    shortfall: required - cover,
    inService: selected.reduce((s, m) => s + (m.inService || 0), 0),
    totalStock: selected.reduce((s, m) => s + (m.totalStock || 0), 0),
    currentOrders: selected.reduce((s, m) => s + (m.currentOrders || 0), 0),
    orderQty: selected.reduce((s, m) => s + askQty(m), 0),
    orderCost: selected.reduce((s, m) => s + askCost(m), 0),
    months,
    peakMonth: peak,
    subset: true,
    subsetCodes: selected.map((m) => m.code),
  };
}

const TIPS = {
  originalAsk: "Buy-month shortfall $: fleet needed for the last forecast month’s projected in-service, minus stock + on order. Peak-month shortfall is not in this number.",
  peakAsk: "Peak-month shortfall $: fleet needed for FileMaker Peak IS (Forecast Max), minus stock + on order. Same basis as Forecast Orders. Usually too late to buy — compare with Buy month.",
  orderLines: "How many SKUs are short for the buy month (last forecast month), not the peak.",
  orderQtySum: "Total units of the buy-month shortfall.",
  shortfallSkus: "Items where stock + current orders is below what the buy-month in-service needs at target utilisation.",
  systemRequested: "Buy-month shortfall × landed cost. Peak / too-late months are excluded — those are ops / interstate transfers.",
  peakOps: "Peak forecast month — strongest starts. Too late to buy; use transfers or other ops. Not in the dollar ask.",
  decisionSoFar: "Dollar value of quantities typed in the Decision column. $0 means no GM buy has been entered yet.",
  familyChip: "Filter the grid to this family. The number is buy-month lines; the $ is the buy ask.",
  item: "Inventory code. Full name on the grey line. Tick items in the same family to open a combined Demand. Click the row (not Decision) to open one item.",
  family: "Product family this item belongs to.",
  landed: "Landed cost per unit — what one more unit costs to buy.",
  onHand: "Units in the yard / depot, not currently on hire.",
  inService: "Units currently out on hire.",
  totalStock: "On hand + in service. The fleet you have today.",
  util: "In service ÷ total stock. How much of the fleet is out.",
  target: "FileMaker target utilisation. Buy required = ceil(buy-month projected in-service ÷ this target). Peak in-service is not used for the ask.",
  currentOrders: "Units already on order from suppliers, not yet in the fleet.",
  surplus: "Stock + current orders − required for the selected ask (Buy month or Peak IS). Negative is the shortfall / dollar ask.",
  orderQty: "Buy-month shortfall qty: max(0, required for last-forecast-month in-service − cover).",
  otherSug: "That other state’s FileMaker suggested buy for the same item — so you can see if they are already covering it.",
  decision: "Type the qty you actually want to buy. This is the GM override of the buy-month shortfall.",
  decisionCost: "Decision qty × landed cost.",
  systemQty: "Buy-month shortfall qty. Not FileMaker’s peak-based SystemRequestedQty.",
  systemCost: "SystemRequestedQty × landed cost.",
  propSurplus: "Surplus after FileMaker’s proposed columns. Use Decision if you are buying a different qty.",
  propUtil: "Utilisation after FileMaker’s proposed columns.",
  orderCost: "Buy-month shortfall × landed cost for this line.",
  forecastMax: "Peak in-service this forecast (FileMaker Forecast Max). Highlighted for ops / transfers. Not the buy ask.",
  required: "Fleet needed at target utilisation for the buy month: ceil(last-forecast-month projected in-service ÷ target). Peak required is not used for the ask.",
  cover: "Total stock today + current supplier orders. What you already have or have bought.",
  shortfall: "Buy-month required − cover. Positive is the dollar ask. Peak-month gap is ops only.",
  proposedBuy: "Units to buy for the last forecast month. Too-late months are excluded.",
  opsGap: "How far peak in-service is above cover. Too late to buy — transfers or other ops, not this ask.",
  nowInService: "Units of this item on hire right now.",
  poCover: "Projected POs for the last forecast month (plus any hire after it, still inside the 4-month lead) as a % of that month’s forecast OUT. Nov 2026 is too soon to buy for. ≥70% treat the ask as firm; 40–70% mixed; under 40% go easier.",
  firmWaiting: "Customer POs already raised and not yet on hire. These usually mature in months 1–3 — too late to buy for. Use stock + current orders.",
  peakOut: "Submitted Sales Forecast OUT units in the last forecast month — the only month this buy can still serve inside the Sales Forecast.",
  conversionDays: "Average days from customer PO date raised to on hire (ERP HireDate, else InstallDateCompleted), last 12 months, weighted by waiting units. This is PO-to-on-hire lag, not hire duration.",
  projPo: "POs not yet raised. Each builder’s recent raise rate (last 90 days if they raised 2+, else 12-month average), minus raises already booked this month, then shifted by their ERP days-to-on-hire. Shown on the last forecast month and any month after the forecast if the hire still lands inside the 4-month lead.",
  weightedDays: "Customer-weighted hire duration on this item now (large clients move the number more).",
  priorWeighted: "Same weighted hire duration in the previous Sales Forecast month.",
  daysChange: "Change in weighted hire days versus last forecast. Longer means stock stays out and less comes back to install again.",
  extraHeld: "Item-wide extra units held (or released): peak starts × weighted day change ÷ working days. The table footers sum every builder that moved, not only the top 8 rows.",
  outStarts: "Forecast site starts that month, in this item’s units (LM × qty/m).",
  inReturning: "FileMaker StockReturning: return window (start/end, shifted by blackout, using CompanyAvgDays) → calculated returning LM, not each contract’s planned off-hire date. IN = OUT − NET. Hidden when NET was left at 0 on an override-only month.",
  inUnfiled: "Sales Forecast did not file returning for this month. OUT is from TotalLM Override; Submitted, TotalLM and UsingAve are 0, and NetRequired is 0. IN is not copied from OUT.",
  netHeld: "OUT − IN. Extra stock the fleet must hold that month. Negative (purple) means more is returning than starting. Blank when returning was not filed.",
  netReleased: "IN greater than OUT — stock coming back, not extra held.",
  projectedIS: "Projected in-service if the monthly OUT/IN path is followed.",
  poBacked: "Waiting customer POs already in ERP, timed to expected hire month (date raised + that builder’s avg days). Usually months 2–3 — too late for a 4-month buy.",
  requiredLine: "Dashed line: fleet required at target utilisation.",
  coverLine: "Dashed line: total stock + current orders you already have.",
  workingDays: "Working days in that forecast month.",

function tipAttr(text, title) {
  if (!text) return "";
  return ` data-tip="${esc(text)}"${title ? ` data-tip-title="${esc(title)}"` : ""}`;
}
function kpiCard(label, val, klass, def, cardClass) {
  return `<div class="card ${cardClass || ""}"${tipAttr(def, label)}><div class="label">${esc(label)}</div><div class="val ${klass || ""}">${val}</div></div>`;
}
function thTip(label, def, left) {
  return `<th class="${left ? "l" : ""}"${tipAttr(def, label)}>${esc(label)}</th>`;
}
function thSort(label, key, def, left) {
  const on = gridSort.key === key;
  const mark = on ? (gridSort.dir === "asc" ? "▲" : "▼") : "";
  const how = TEXT_SORT.has(key) ? "Click to sort A–Z / Z–A." : "Click to sort high–low / low–high.";
  return `<th class="sortable${on?" on":""}${left?" l":""}" data-sort="${esc(key)}"${tipAttr((def ? def + " " : "") + how, label)}>${esc(label)}${mark ? `<span class="sort-mark">${mark}</span>` : ""}</th>`;
}
function sortValue(r, key) {
  if (key.startsWith("sug:")) return (r.suggested || {})[key.slice(4)] || 0;
  if (key.startsWith("st:")) return askCostState(r, key.slice(3));
  if (key === "sysQty") return askQty(r);
  if (key === "sysCost") return askCost(r);
  if (key === "surplus") return askSurplus(r);
  const v = r[key];
  if (v == null || v === "") return TEXT_SORT.has(key) ? "" : 0;
  return v;
}
function sortGridRows(rows) {
  const key = gridSort.key || "code";
  const dir = gridSort.dir === "asc" ? 1 : -1;
  const text = TEXT_SORT.has(key);
  return rows.slice().sort((a, b) => {
    const av = sortValue(a, key);
    const bv = sortValue(b, key);
    const cmp = text
      ? String(av).localeCompare(String(bv), "en", { numeric: true, sensitivity: "base" })
      : (Number(av) || 0) - (Number(bv) || 0);
    if (cmp) return cmp * dir;
    return String(a.code || "").localeCompare(String(b.code || ""));
  });
}
function setGridSort(key) {
  if (!key) return;
  if (gridSort.key === key) gridSort.dir = gridSort.dir === "asc" ? "desc" : "asc";
  else {
    gridSort.key = key;
    gridSort.dir = TEXT_SORT.has(key) ? "asc" : "desc";
  }
  const wrap = $("grid");
  const top = wrap ? wrap.scrollTop : 0;
  const left = wrap ? wrap.scrollLeft : 0;
  draw();
  const after = $("grid");
  if (after) {
    after.scrollTop = top;
    after.scrollLeft = left;
  }
}
function bindGridSort() {
  $("grid").querySelectorAll("th[data-sort]").forEach((th) => {
    th.addEventListener("click", () => setGridSort(th.dataset.sort));
  });
}
function tdTip(html, def, extra, left) {
  return `<td class="${[left ? "l" : "", extra || ""].filter(Boolean).join(" ")}"${tipAttr(def)}>${html}</td>`;
}

(function bindHoverTips() {
  const box = document.getElementById("hover-tip");
  const place = (e) => {
    const pad = 14;
    const w = box.offsetWidth;
    const h = box.offsetHeight;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
    box.style.left = Math.max(8, x) + "px";
    box.style.top = Math.max(8, y) + "px";
  };
  document.addEventListener("pointerover", (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el) {
      box.style.display = "none";
      return;
    }
    const title = el.getAttribute("data-tip-title");
    const body = el.getAttribute("data-tip") || "";
    box.innerHTML = (title ? `<div class="tip-title">${esc(title)}</div>` : "") + esc(body);
    box.style.display = "block";
    place(e);
  });
  document.addEventListener("pointermove", (e) => {
    if (box.style.display === "block") place(e);
  });
  document.addEventListener("pointerout", (e) => {
    if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-tip]")) return;
    if (e.target.closest && e.target.closest("[data-tip]") && e.relatedTarget && e.target.closest("[data-tip]").contains(e.relatedTarget)) return;
    box.style.display = "none";
  });
})();

function pageParams() {
  return new URLSearchParams(location.search);
}

function syncUrl(code) {
  const u = new URL(location.href);
  u.searchParams.set("state", state);
  u.searchParams.set("month", month);
  if (code) u.searchParams.set("code", code);
  else u.searchParams.delete("code");
  if (askBasis === "peak") u.searchParams.set("ask", "peak");
  else u.searchParams.delete("ask");
  history.replaceState(null, "", u.pathname + u.search);
}

async function boot() {
  const params = pageParams();
  const startState = params.get("state");
  const startMonth = params.get("month");
  const startCode = params.get("code") || "";
  const startAsk = params.get("ask") || "";
  if (startAsk === "peak") askBasis = "peak";
  else {
    try { if (localStorage.getItem("stockReviewAsk") === "peak") askBasis = "peak"; } catch (e) {}
  }
  const r = await fetch("/api/files");
  const j = await r.json();
  files = j.files || [];
  const qld = files.filter(f => f.state === "QLD");
  if (startState && (startState === NAT || STATES.includes(startState))) state = startState;
  if (startMonth) month = startMonth;
  else if (qld.length) month = qld[0].month;
  else if (files[0]) { state = files[0].state; month = files[0].month; }
  renderControls();
  await load();
  if (startCode) await openDemand(startCode);
}

function isNational() {
  return state === NAT;
}

function renderControls() {
  const natTip = tipAttr("Total system-requested shortfall across every state that has a calculator. Not a GM Forecast Order.", "National");
  $("states").innerHTML =
    `<button data-s="${NAT}" class="${isNational()?"on":""}"${natTip}>National</button>` +
    STATES.map(s =>
      `<button data-s="${s}" class="${s===state?"on":""}"${tipAttr("System-requested shortfall for " + s + ".", s)}>${s}</button>`
    ).join("");
  $("states").onclick = (e) => {
    const btn = e.target.closest("[data-s]");
    const s = btn && btn.dataset.s;
    if (!s || s === state) return;
    state = s;
    if (!isNational()) {
      const avail = files.filter(f => f.state === s);
      if (avail.length && !avail.some(f => f.month === month)) month = avail[0].month;
    }
    view = "details";
    showView();
    renderControls();
    load();
  };
  const months = [...new Set(
    (isNational() ? files : files.filter(f => f.state === state)).map(f => f.month)
  )].sort().reverse();
  if (months.length && !months.includes(month)) month = months[0];
  $("month").innerHTML = months.map(m => `<option value="${esc(m)}" ${m===month?"selected":""}>${esc(fmtMonth(m))}</option>`).join("");
  $("month").onchange = () => { month = $("month").value; load(); };
  $("onlyOrders").className = "btn" + (onlyOrders ? " primary" : "");
  $("onlyOrders").onclick = () => { onlyOrders = !onlyOrders; $("onlyOrders").className = "btn" + (onlyOrders ? " primary" : ""); draw(); };
  $("q").oninput = () => { q = $("q").value.trim().toLowerCase(); draw(); };
  $("export").href = exportHref();
  const askEl = $("askBasis");
  if (askEl) {
    askEl.innerHTML = `
      <button data-ask="buy" class="${askBasis==="buy"?"on":""}">Buy month</button>
      <button data-ask="peak" class="${askBasis==="peak"?"on":""}">Peak month</button>`;
    askEl.onclick = (e) => {
      const btn = e.target.closest("[data-ask]");
      const next = btn && btn.dataset.ask;
      if (!next || next === askBasis) return;
      askBasis = next;
      try { localStorage.setItem("stockReviewAsk", askBasis); } catch (err) {}
      renderControls();
      if (view === "demand" && demand) drawDemand();
      else if (view === "stocktakes" && stocktakes) drawStocktakes();
      else draw();
    };
  }
  const sub = $("headerSub");
  if (sub) {
    sub.textContent = askBasis === "peak"
      ? "Peak ask uses peak-month projected in-service (often October). That month is usually too late to buy — compare it with Buy month, which is the last forecast month you can still purchase for. Decision is the GM override."
      : "Buy ask is the last forecast month only (Dec 2026 on a Sep 2026 file). Peak months are highlighted for ops / transfers — switch to Peak month to see that ask. Decision is the GM override.";
  }
}

function nearestCalcMonth(st, want) {
  const avail = files.filter(f => f.state === st).map(f => f.month).sort().reverse();
  if (avail.includes(want)) return want;
  return avail.find(m => m <= want) || null;
}

function mergeNationalDetails(wantMonth, parts) {
  const byState = [];
  const merged = new Map();
  const filesUsed = [];
  const submitted = new Set();
  const orderLocks = [];
  let modified = "";
  let cacheDate = "";
  for (const part of parts) {
    const st = part.state;
    const d = part.data;
    if (!d) {
      byState.push({
        state: st, missing: true, file: "", calcMonth: "", exact: false,
        orderLines: 0, orderQty: 0, orderCost: 0, sysCost: 0, decisionCost: 0, shortfallLines: 0,
      });
      continue;
    }
    filesUsed.push(d.file);
    if (d.modified && d.modified > modified) modified = d.modified;
    if (!cacheDate && d.cacheDate) cacheDate = d.cacheDate;
    String(d.forecastSubmitted || "").split("+").map(s => s.trim()).filter(Boolean).forEach(s => submitted.add(s));
    if (d.orderSubmitted) orderLocks.push(`${st} ${d.orderSubmitted}`);
    byState.push({
      state: st,
      missing: false,
      file: d.file,
      calcMonth: part.calcMonth || wantMonth,
      exact: !!(part.exact),
      cacheDate: d.cacheDate || "",
      forecastSubmitted: d.forecastSubmitted || "",
      orderSubmitted: d.orderSubmitted || "",
      orderLines: (d.rows || []).filter((r) => (r.sysQty || 0) > 0).length,
      orderQty: (d.rows || []).reduce((s, r) => s + (r.sysQty || 0), 0),
      orderCost: (d.rows || []).reduce((s, r) => s + (r.sysCost || 0), 0),
      sysCost: (d.rows || []).reduce((s, r) => s + (r.sysCost || 0), 0),
      decisionCost: d.totals.decisionCost,
      shortfallLines: d.totals.shortfallLines,
    });
    for (const r of d.rows) {
      let row = merged.get(r.code);
      if (!row) {
        row = {
          code: r.code, name: r.name, family: r.family, landed: r.landed,
          onHand: 0, inService: 0, totalStock: 0, currentOrders: 0, surplus: 0,
          orderQty: 0, orderCost: 0, sysQty: 0, sysCost: 0, decisionCost: 0,
          buyQty: 0, buyCost: 0, peakQty: 0, peakCost: 0, buySurplus: 0, peakSurplus: 0, byState: {},
        };
        merged.set(r.code, row);
      }
      row.onHand += r.onHand || 0;
      row.inService += r.inService || 0;
      row.totalStock += r.totalStock || 0;
      row.currentOrders += r.currentOrders || 0;
      row.surplus += r.surplus || 0;
      row.orderQty += r.sysQty || 0;
      row.orderCost += r.sysCost || 0;
      row.sysQty += r.sysQty || 0;
      row.sysCost += r.sysCost || 0;
      row.buyQty += r.buyQty || 0;
      row.buyCost += r.buyCost || 0;
      row.peakQty += r.peakQty || 0;
      row.peakCost += r.peakCost || 0;
      row.buySurplus += r.buySurplus || 0;
      row.peakSurplus += r.peakSurplus || 0;
      row.decisionCost += r.decisionCost || 0;
      row.byState[st] = {
        orderQty: r.sysQty || 0, orderCost: r.sysCost || 0, sysQty: r.sysQty || 0, sysCost: r.sysCost || 0, surplus: r.surplus || 0,
        buyQty: r.buyQty || 0, buyCost: r.buyCost || 0, peakQty: r.peakQty || 0, peakCost: r.peakCost || 0,
        buySurplus: r.buySurplus || 0, peakSurplus: r.peakSurplus || 0,
      };
    }
  }
  const rows = [...merged.values()].sort((a, b) => a.code.localeCompare(b.code));
  const monthByState = Object.fromEntries(byState.map(s => [s.state, s.calcMonth]));
  for (const r of rows) {
    const ranked = STATES.filter(s => (r.byState[s] || {}).sysQty > 0).sort((a, b) => (r.byState[b].sysQty || 0) - (r.byState[a].sysQty || 0));
    r.topState = ranked[0] || STATES.find(s => monthByState[s]) || "QLD";
    r.topMonth = monthByState[r.topState] || wantMonth;
  }
  const orderRows = rows.filter(r => r.sysQty > 0);
  const families = {};
  for (const r of rows) {
    const fam = r.family || "(blank)";
    if (!families[fam]) families[fam] = { family: fam, n: 0, orderLines: 0, orderCost: 0, sysCost: 0, decisionCost: 0 };
    families[fam].n += 1;
    if (r.sysQty > 0) {
      families[fam].orderLines += 1;
      families[fam].orderCost += r.sysCost;
      families[fam].sysCost += r.sysCost;
    }
    families[fam].decisionCost += r.decisionCost;
  }
  return {
    state: NAT,
    month: wantMonth,
    national: true,
    file: filesUsed.join(" · ") || "—",
    modified,
    cacheDate,
    forecastSubmitted: [...submitted].join("+"),
    orderSubmitted: orderLocks.join(" · "),
    byState,
    totals: {
      items: rows.length,
      orderLines: orderRows.length,
      orderQty: orderRows.reduce((s, r) => s + r.sysQty, 0),
      orderCost: orderRows.reduce((s, r) => s + r.sysCost, 0),
      sysCost: orderRows.reduce((s, r) => s + r.sysCost, 0),
      decisionCost: rows.reduce((s, r) => s + r.decisionCost, 0),
      shortfallLines: rows.filter(r => r.surplus < 0).length,
    },
    families: Object.values(families).sort((a, b) => b.orderCost - a.orderCost),
    rows,
    buyMonthKey: parts.map((p) => p.data && p.data.buyMonthKey).find(Boolean) || "",
    peakMonthKey: parts.map((p) => p.data && p.data.peakMonthKey).find(Boolean) || "",
  };
}

async function fetchNationalFallback() {
  const parts = [];
  for (const st of STATES) {
    const m = nearestCalcMonth(st, month);
    if (!m) {
      parts.push({ state: st, data: null });
      continue;
    }
    const r = await fetch(`/api/details?state=${st}&month=${m}`);
    const j = await r.json();
    if (!r.ok) parts.push({ state: st, data: null });
    else parts.push({ state: st, calcMonth: m, exact: m === month, data: j });
  }
  return mergeNationalDetails(month, parts);
}

async function load() {
  $("banner").textContent = `Loading ${isNational() ? "National" : state} ${fmtMonth(month)}…`;
  $("grid").innerHTML = "";
  try {
    let j;
    if (isNational()) {
      const r = await fetch(`/api/details?state=${NAT}&month=${month}`);
      j = await r.json();
      if (!r.ok || !j.national) j = await fetchNationalFallback();
    } else {
      const r = await fetch(`/api/details?state=${state}&month=${month}`);
      j = await r.json();
      if (!r.ok) throw new Error(j.error || r.statusText);
    }
    data = j;
    family = "ALL";
    pickedCodes = [];
    $("export").href = exportHref();
    syncUrl(view === "demand" ? selectedCode : "");
    if (view === "stocktakes") await loadStocktakes();
    else draw();
  } catch (e) {
    $("banner").innerHTML = `<span class="err">${e.message}</span>`;
  }
}

async function loadStocktakes() {
  if (isNational()) {
    $("view-stocktakes").innerHTML = `<div class="banner">Stocktakes are per state. Pick QLD, NSW, VIC or SA in the top row.</div>`;
    showView();
    return;
  }
  $("view-stocktakes").innerHTML = `<div class="banner">Loading stocktake ages for ${esc(state)} ${esc(fmtMonth(month))}…</div>`;
  showView();
  try {
    const r = await fetch(`/api/stocktakes?state=${state}&month=${month}&staleDays=${staleDays}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    stocktakes = j;
    drawStocktakes();
  } catch (e) {
    $("view-stocktakes").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function stockStatusLabel(s) {

    fresh: "Counted in window",
    "after-forecast": "Counted after forecast",
    "not-required": "Not required",

}

function drawStocktakes() {
  const d = stocktakes;
  if (!d) return;
  const t = d.totals;
  const onAskStale = (d.rows || []).filter((r) => (r.status === "stale" || r.status === "never") && askQty(r) > 0).length;
  $("banner").textContent =
    `${state} ${fmtMonth(month)} · forecast cache ${fmtDay(d.cacheDate) || "—"} · stocktake window ${d.staleDays} days` +
    (d.source ? ` · ${d.source}${d.importedAt ? " " + new Date(d.importedAt).toLocaleString("en-AU") : ""}` : "");
  const fams = [{family:"ALL", n:t.items, stale:t.stale, never:t.never}, ...d.families];
  let rows = d.rows.filter((r) => {
    if (family !== "ALL" && r.family !== family) return false;
    if (staleOnly && d.hasData && !(r.status === "stale" || r.status === "never")) return false;
    if (negOnly && !r.negative) return false;
    if (q && !(`${r.code} ${r.name}`.toLowerCase().includes(q))) return false;
    return true;
  });
  rows = rows.slice().sort((a, b) => {
    if (stockSort === "item") return a.code.localeCompare(b.code);
    if (stockSort === "family") return a.family.localeCompare(b.family) || a.code.localeCompare(b.code);
    if (stockSort === "date") return String(a.lastStocktake || "").localeCompare(String(b.lastStocktake || "")) || a.code.localeCompare(b.code);
    const neg = (b.negative ? 1 : 0) - (a.negative ? 1 : 0);
    if (neg) return neg;
    const rank = { never: 0, stale: 1, "after-forecast": 2, "no-data": 3, "not-required": 4, fresh: 5 };
    const rd = (rank[a.status] ?? 9) - (rank[b.status] ?? 9);
    if (rd) return rd;
    return (b.daysBeforeForecast ?? 9999) - (a.daysBeforeForecast ?? 9999);
  });
  const tone = (s) => s === "stale" || s === "never" ? "neg" : s === "fresh" ? "pos" : "";
  $("view-stocktakes").innerHTML = `
    <div class="why">
      <p>Stocktakes should be done <b>just before the forecast</b>. This flags items that, at cache date <b>${esc(fmtDay(d.cacheDate) || "—")}</b>, had no count in the last <b>${d.staleDays} days</b>. ${onAskStale ? `<span class="neg">${num(onAskStale)} of those are on this month’s ask.</span>` : ""} ${t.negative ? `<span class="neg">${num(t.negative)} items have a negative on-hand or branch count.</span>` : ""}</p>
      <p class="muted">${d.hasData
        ? "Dates are FileMaker LocationItem LastStocktake — not in StockCalculator or live ERP snapshots. Compared to the forecast cache date. Negative counts come from StockCalculator on-hand / branch SOH."
        : "LastStocktake is not in StockCalculator or the ERP snapshot, and no LocationItem CSV / FileMaker pull is loaded — so every row shows “No LastStocktake file”, not “never counted”. Import a Stocktake List CSV (ItemCode, LastStocktake, Branch) or use Pull from FileMaker. Negative on-hand / branch SOH still flags from the calculator."}</p>
    </div>
    <div class="cards">

            ${tdTip(esc(stockStatusLabel(r.status)), TIPS.stockStatus, tone(r.status), true)}
            ${tdTip(askQty(r)?num(askQty(r)):"", TIPS.onAsk)}
            ${tdTip(`<b>${num(r.totalStock)}</b>`, TIPS.totalStock, r.totalStock<0?"neg":"")}

  $("negOnly").onclick = () => { negOnly = !negOnly; drawStocktakes(); };

      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ csv, source: file.name })

function visibleRows() {
  if (!data) return [];
  const rows = data.rows.filter(r => {
    if (onlyOrders && !onBuy(r)) return false;
    if (family !== "ALL" && r.family !== family) return false;
    if (q && !(`${r.code} ${r.name}`.toLowerCase().includes(q))) return false;
    return true;
  });
  return sortGridRows(rows);
}

function stateOrderTip(st) {
  return isPeakAsk()
    ? "Peak-month shortfall $ for " + st + "."
    : "Buy-month shortfall $ for " + st + ". Peak / too-late months are excluded.";
}

function draw() {
  if (!data) return;
  if (data.national) {
    drawNational();
    return;
  }
  const viewAsk = summarizeAsk(data);
  const t = viewAsk.totals;
  const famList = viewAsk.families;
  const locked = data.orderSubmitted ? `Forecast Orders locked: ${data.orderSubmitted}` : "Forecast Orders not locked";
  $("banner").textContent =
    `${data.file} · cache ${fmtDay(data.cacheDate) || "—"} · submitted ${fmtDay(data.forecastSubmitted) || "—"} · ${locked} · updated ${new Date(data.modified).toLocaleString("en-AU")}` +
    (isPeakAsk() ? " · peak-month ask" : " · buy-month ask");
  $("kpis").innerHTML = [
    kpiCard(askNoun() + " ask " + fmtMonth(askMonthKey(data) || ""), aud(t.sysCost), "", isPeakAsk() ? TIPS.peakAsk : TIPS.systemRequested),
    kpiCard(askNoun() + " lines", num(t.orderLines), "", TIPS.orderLines),
    kpiCard(askNoun() + " qty", num(t.orderQty), "", TIPS.orderQtySum),
    kpiCard("Decision so far", aud(t.decisionCost), "", TIPS.decisionSoFar),
  ].join("");
  const fams = [{family:"ALL", orderLines:t.orderLines, sysCost:t.sysCost}, ...famList.filter(f => f.orderLines || f.sysCost)];
  $("families").innerHTML = fams.map(f =>
    `<button class="chip ${f.family===family?"on":""}" data-f="${f.family}"${tipAttr(TIPS.familyChip, f.family==="ALL"?"All families":f.family)}>${f.family==="ALL"?"All families":f.family} · ${f.orderLines} · ${aud(f.sysCost)}</button>`
  ).join("");

    <thead><tr>

      ${thSort("On Hand", "onHand", TIPS.onHand)}${thSort("In Service", "inService", TIPS.inService)}${thSort("Total Stock", "totalStock", TIPS.totalStock)}
      ${thSort("Util", "util", TIPS.util)}${thSort("Target", "targetUtil", TIPS.target)}${thSort("Current Orders", "currentOrders", TIPS.currentOrders)}

  $("grid").querySelectorAll("input.dec").forEach(inp => {

  $("grid").querySelectorAll("input.pick-item").forEach((inp) => {

}

function esc(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function clip(s, n) {
  const t = String(s || "");
  return t.length > n ? t.slice(0, n) + "…" : t;
}

async function saveDecision(code, value) {
  await fetch("/api/decisions", {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ state, month, code, decision: value })
  });
  await load();
}

$("tabs").onclick = (e) => {
  const v = e.target.dataset.view;
  if (!v) return;
  if (v === "demand" && !selectedCode) return;
  view = v;
  showView();
  if (v === "stocktakes") loadStocktakes();
};

function showView() {
  $("view-details").hidden = view !== "details";
  $("view-demand").hidden = view !== "demand";
  $("view-stocktakes").hidden = view !== "stocktakes";
  $("onlyOrders").hidden = view === "stocktakes";
  $("tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
}

async function openPickedDemand() {
  const rows = pickedRows();
  if (!rows.length) return;
  const fams = pickedFamilies();
  if (fams.length > 1) {
    alert("Pick items from one product family.");
    return;
  }
  await openDemand(rows[0].code, rows.map((r) => r.code));
}

async function openDemand(code, picked) {
  selectedCode = code;
  if (picked && picked.length) {
    pickedCodes = picked.slice();
  } else {
    const row = ((data && data.rows) || []).find((r) => r.code === code);
    if (row && row.family) {
      pickedCodes = pickedRows().filter((r) => r.family === row.family).map((r) => r.code);
    }
  }
  $("tabDemand").disabled = false;
  $("tabDemand").textContent = picked && picked.length >= 2
    ? `Demand · ${picked.length} items`
    : `Demand · ${code}`;
  view = "demand";
  $("view-demand").innerHTML = `<div class="banner">Loading demand for ${esc(code)}…</div>`;
  showView();
  const row = data && data.rows && data.rows.find((r) => r.code === code);
  const demandState = isNational() ? ((row && row.topState) || "QLD") : state;
  const demandMonth = isNational() ? ((row && row.topMonth) || month) : month;
  try {
    const r = await fetch(`/api/demand?state=${demandState}&month=${demandMonth}&code=${encodeURIComponent(code)}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    demand = j;
    demandScope = picked && picked.length >= 2 ? "picked" : "item";
    demandChartMode = picked && picked.length >= 2 ? "stock" : "buy";
    syncUrl(code);
    drawDemand();
  } catch (e) {
    $("view-demand").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function daysf(n) {
  return n == null || !Number.isFinite(Number(n)) ? "—" : Number(n).toFixed(1);
}
function signed(n, digits) {
  if (n == null || !Number.isFinite(Number(n))) return "—";
  const v = Number(n);
  return (v > 0 ? "+" : "") + v.toFixed(digits);
}

function durationBlock(d) {
  const dur = d.duration || {};
  const peak = d.peakMonth || {};
  const priorLabel = dur.priorMonth || "last forecast";
  const dir = dur.direction || "stable";
  const tone = dir === "longer" ? "warn" : dir === "shorter" ? "good" : "flat";
  const dirWord = dir === "longer" ? "increased" : dir === "shorter" ? "decreased" : "held steady";
  const extra = Math.round(dur.extraUnits || 0);
  const extraAbs = Math.abs(extra);
  let impact = `No prior Sales Forecast (${priorLabel}) to compare hire duration.`;
  if (dur.prior != null && dur.delta != null) {
    const held = dir === "longer"
      ? `About ${num(extraAbs)} extra units of this item stay on hire instead of coming back for the next install — same starts, more fleet, higher ask.`
      : dir === "shorter"
        ? `About ${num(extraAbs)} units come back sooner and can be used again — that eases the ask.`
        : `Duration has not moved enough to change the ask on its own.`;
    impact = `Hire duration has <b>${dirWord}</b> versus ${esc(priorLabel)}. Weighted days are ${daysf(dur.compared != null ? dur.compared : dur.current)} now vs ${daysf(dur.prior)} last forecast (${signed(dur.delta, 1)} days${dur.deltaPct != null ? ", " + signed(dur.deltaPct, 1) + "%" : ""}). ${held}`;
  }
  const moverRows = (rows) => rows && rows.length
    ? rows.map((m) => `<tr>
        ${tdTip(esc(m.company), "Builder whose hire duration moved.", "", true)}
        ${tdTip(esc(m.product), "Hire product this duration is measured on.", "muted", true)}
        ${tdTip(daysf(m.priorDays), TIPS.daysWas)}
        ${tdTip(daysf(m.days), TIPS.daysNow)}
        ${tdTip(signed(m.delta, 0), TIPS.deltaDays, m.delta>0?"neg":"pos")}
        ${tdTip(m.hires ? num(Math.round(m.hires)) : "—", TIPS.peakHiresRow)}
        ${tdTip(m.outLm ? num(Math.round(m.outLm)) : "—", TIPS.peakLmRow)}
        ${tdTip(num(Math.round(m.units)), TIPS.thisItemUnits)}
        ${tdTip(signed(m.extraUnits, 0), TIPS.extraHeldRow, m.extraUnits>0?"neg":"pos")}
      </tr>`).join("")
    : `<tr><td class="l muted" colspan="9">None over 1 day</td></tr>`;
  const moverFoot = (s) => {
    if (!s || !s.n) return "";
    return `<tfoot><tr>
        ${tdTip(`<b>All ${num(s.n)} builders</b>`, TIPS.durationFoot, "", true)}
        ${tdTip("weighted", TIPS.durationFoot, "muted", true)}
        <td></td><td></td>
        ${tdTip(signed(s.delta, 1), TIPS.durationFoot, s.delta>0?"neg":s.delta<0?"pos":"")}
        ${tdTip(num(Math.round(s.hires || 0)), TIPS.durationFoot)}
        ${tdTip(num(Math.round(s.outLm || 0)), TIPS.durationFoot)}
        ${tdTip(num(Math.round(s.units || 0)), TIPS.durationFoot)}
        ${tdTip(signed(s.extraUnits, 0), TIPS.durationFoot, s.extraUnits>0?"neg":s.extraUnits<0?"pos":"")}
      </tr></tfoot>`;
  };
  const moverHead = `<thead><tr>
    ${thTip("Customer", "Builder whose hire duration moved.", true)}
    ${thTip("Product", "Hire product this duration is measured on.", true)}
    ${thTip("Was", TIPS.daysWas)}${thTip("Now", TIPS.daysNow)}
    ${thTip("Δ days", TIPS.deltaDays)}
    ${thTip("Peak contracts", TIPS.peakHiresRow)}
    ${thTip("Peak metres", TIPS.peakLmRow)}
    ${thTip("Peak units", TIPS.thisItemUnits)}${thTip("Extra held", TIPS.extraHeldRow)}
  </tr></thead>`;
  const longS = dur.longerAll || {};
  const shortS = dur.shorterAll || {};
  const netExtra = (longS.extraUnits || 0) + (shortS.extraUnits || 0);
  const netLine = (longS.n || shortS.n)
    ? `<p class="muted duration-net">${longS.n ? `Lengthening: <b>${num(longS.n)}</b> builders, weighted ${signed(longS.delta, 1)} days, <span class="neg">${signed(longS.extraUnits, 0)}</span> extra units on the ask.` : "No builders lengthened."}
       ${shortS.n ? `Shortening: <b>${num(shortS.n)}</b> builders, weighted ${signed(shortS.delta, 1)} days, <span class="pos">${signed(shortS.extraUnits, 0)}</span> units released.` : "No builders shortened."}
       Net from these duration moves: <b class="${netExtra>0?"neg":netExtra<0?"pos":""}">${signed(netExtra, 0)}</b> units ${netExtra>0?"added to":netExtra<0?"taken off":"on"} the ask. The cards above use the item-wide weighted day change × peak starts ÷ working days — that is the overall duration effect on required fleet.</p>`
    : "";
  return `
    <h2>Hire duration — stock staying out</h2>
    <p class="muted">Weighted by each customer’s peak-month units of this item (LM × qty/m), so large clients move the signal. Compared on the same customer × product set as ${esc(priorLabel)}. Peak contracts and metres are that builder’s forecast in the peak-starts month. Extra held = this month’s starts × change in days ÷ working days (${dur.workingDays || "—"}) — stock that does not come back to install again.</p>
    <div class="cards">
      ${kpiCard("Weighted days now", daysf(dur.compared != null ? dur.compared : dur.current), "", TIPS.weightedDays, tone)}
      ${kpiCard(priorLabel + " weighted", daysf(dur.prior), "", TIPS.priorWeighted)}
      ${kpiCard("Change", signed(dur.delta, 1) + "d", dur.delta>0?"neg":dur.delta<0?"pos":"", TIPS.daysChange, tone)}
      ${kpiCard(dir === "shorter" ? "Units released" : "Extra units held", extra ? signed(extra, 0) : "—", extra>0?"neg":extra<0?"pos":"", TIPS.extraHeld, tone)}
    </div>
    <div class="why ${tone === "warn" ? "card warn" : tone === "good" ? "card good" : ""}">
      <p>${impact}</p>
    </div>
    <div class="split duration-tables">
      <div>
        <h2>Lengthening — increases the ask</h2>
        <div class="table-wrap" style="max-height:none">
          <table>${moverHead}<tbody>${moverRows(dur.longer)}</tbody>${moverFoot(dur.longerAll)}</table>
        </div>
      </div>
      <div>
        <h2>Shortening — eases the ask</h2>
        <div class="table-wrap" style="max-height:none">
          <table>${moverHead}<tbody>${moverRows(dur.shorter)}</tbody>${moverFoot(dur.shorterAll)}</table>
        </div>
      </div>
    </div>
    ${netLine}`;
}

function mergePoMonths(months, conversion) {
  if (!conversion || !conversion.months) return months || [];
  const map = {};
  for (const m of conversion.months) {
    const key = m.key || String(m.date || "").slice(0, 7);
    if (key) map[key] = { poUnits: m.poUnits || 0, projUnits: m.projUnits || 0 };
  }
  return (months || []).map((m) => {
    const hit = map[String(m.date || "").slice(0, 7)] || {};
    return { ...m, poUnits: hit.poUnits || 0, projUnits: hit.projUnits || 0 };
  });
}

function appendBeyondMonth(months, conversion) {
  const extras = (conversion && conversion.beyondMonths && conversion.beyondMonths.length)
    ? conversion.beyondMonths
    : (conversion && conversion.beyondUnits
      ? [{ key: conversion.beyondKey, projUnits: conversion.beyondUnits }]
      : []);
  if (!extras.length || !(months || []).length) return months || [];
  const last = months[months.length - 1];
  return months.concat(extras.filter((x) => x && x.projUnits).map((x, i) => ({
    index: (last.index || months.length) + 1 + i,
    date: x.key ? x.key + "-01" : "",
    outUnits: 0,
    inUnits: 0,
    netUnits: 0,
    projectedInService: 0,
    poUnits: 0,
    projUnits: x.projUnits,
    beyond: true,
    workingDays: "",
    hires: 0,
    outLm: 0,
    netLm: 0,
  })));
}

function firmBlock(d) {
  const c = d.conversion;
  if (!c) return "";
  const tone = c.confidence || "no-data";
  const cover = c.firmPct == null ? "—" : Math.round(c.firmPct * 100) + "%";
  const cardTone = tone === "firm" ? "good" : tone === "mixed" ? "flat" : tone === "soft" ? "warn" : "";
  const win = (c.buyKeys || []).map(fmtMonth).join(" + ") || "the buy month";
  const sentences = {
    firm: `Projected POs for <b>${esc(win)}</b> cover <b>${cover}</b> of those starts (${num(Math.round(c.buyProj || 0))} of ${num(Math.round(c.buyOut || 0))} units). Only the last forecast month is a buy month — Nov 2026 is too soon. Waiting POs (${num(Math.round(c.firmUnits))} units) mature earlier — use stock + current orders for those.`,
    mixed: `Projected POs for <b>${esc(win)}</b> cover <b>${cover}</b> of forecast starts (${num(Math.round(c.buyProj || 0))} of ${num(Math.round(c.buyOut || 0))}). Part of the last-month book is still unraised. Waiting POs (${num(Math.round(c.firmUnits))} units, ${daysf(c.avgDays)} to on hire) are too late for this buy.`,
    soft: `Projected POs for <b>${esc(win)}</b> cover only <b>${cover}</b> of those starts. Builders are not raising POs at a pace that fills the last forecast month. Go easier on Decision unless duration or cover is already tight. Waiting POs (${num(Math.round(c.firmUnits))} units) hit earlier months and cannot be bought for.`,
    "no-data": "Not enough PO raise history to project the last forecast month yet.",
  };
  const after = c.beyondUnits
    ? ` ${num(Math.round(c.beyondUnits))} of the projected units hire after ${esc(fmtMonth(c.beyondKey) !== "—" ? fmtMonth(c.beyondKey) : "the last forecast month")} — still in the 4-month arrival window.`
    : "";
  return `
    <h2>Firm demand vs forecast</h2>
    <p class="muted">Stock takes about 4 months to arrive. Only the last forecast month is a buy month (Dec 2026 on a Sep 2026 file). Cyan = POs already raised (Sep–Nov — too late). Teal = projected POs timed by ERP days-to-on-hire onto that last month and any month after the forecast still inside the 4-month lead. Cover is projected ÷ that month’s forecast OUT.</p>
    <div class="cards">
      ${kpiCard("Projected cover (buy month)", cover, "", TIPS.poCover, cardTone)}
      ${kpiCard("Projected units (buy month)", num(Math.round(c.buyProj || 0)), "", TIPS.projPo)}
      ${kpiCard("Forecast OUT (buy month)", num(Math.round(c.buyOut || 0)), "", TIPS.peakOut)}
      ${kpiCard("Waiting (too late)", num(Math.round(c.firmUnits)), "", TIPS.firmWaiting)}
      ${kpiCard("Conversion days", c.avgDays == null ? "—" : daysf(c.avgDays), "", TIPS.conversionDays)}
    </div>
    <div class="why ${cardTone ? "card " + cardTone : ""}"><p>${sentences[tone] || sentences["no-data"]}${after}</p></div>
  `;
}

function inputsBlock() {
  return `
    <h2>Where these numbers come from</h2>
    <div class="why">
      <p><b>OUT starts</b> — Sales Forecast LM for that month × this item’s qty/m from StockCalculator. LM order: Submitted, then TotalLM, then UsingAve, then TotalLM Override. Dec 2026 is often Override-only.</p>
      <p><b>IN / returning</b> — not each contract’s planned off-hire date. FileMaker StockReturning opens a return window (ReturningStartDate–EndDate, shifted by Blackout Dates, using CompanyAvgDays). Returning LM is a three-method calc: past actual, straddling today, or previous forecast. NET = forecast OUT pro-rata − that returning LM. We show IN = OUT − NET. If FileMaker left NET at 0 on an override-only month (Dec 2026), IN is not filed — we do not copy OUT into IN.</p>
      <p><b>Hire duration (Days now)</b> — FileMaker <code>CompanyProduct_cv_AvgDays</code>: historical average days on hire for that company × product × state from Contracts. Last two months’ actuals exist as MonthMinus1 / MonthMinus2 qty and contract-count fields — those are not what Days now uses. Days was is the same cv_AvgDays from last month’s SF file.</p>
      <p><b>Qty / m</b> — StockCalculator QtyPerM for this item on each hire product.</p>
      <p><b>Waiting POs / Avg days to on hire</b> — live ERP contracts, last 12 months. Waiting = PO raised and HireDate still empty. Days to on hire = DateRaised → HireDate (or InstallDateCompleted). That is how long a PO sits before it starts, not how long the job stays out.</p>
      <p><b>Projected POs</b> — each builder’s raise rate (90-day if they raised 2+, else 12-month average), minus raises already booked this month, then shifted by that ERP lag. Only the last forecast month — and after-SF months still inside the 4-month lead — count for this buy. Nov 2026 is not a buy month.</p>
      <p><b>Required / cover / ask</b> — Required = ceil(selected month’s projected in-service ÷ target utilisation). Cover = total stock + current supplier orders. The dollar ask is max(0, required − cover). Use the Buy month / Peak month toggle in the header to switch the month. Peak is usually too late to buy.</p>
    </div>
  `;
}

function familyTimelineChart(rows) {
  const months = rows || [];
  if (!months.length) return "";
  const W = 760, H = 240;
  const pad = { l: 56, r: 14, t: 18, b: 34 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const vals = months.flatMap((m) => [m.forecastOut || 0, m.actualOut || 0]);
  const max = Math.max(1, ...vals);
  const y = (v) => pad.t + innerH - (Math.max(0, v) / max) * innerH;
  const n = Math.max(1, months.length);
  const gw = innerW / n;
  const barW = Math.max(10, gw / 5);
  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const v = max * (i / 4);
    const yy = y(v);
    grid += `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#2d3845"/>`;
    grid += `<text x="${pad.l-6}" y="${yy+3}" text-anchor="end" fill="#8b98a5" font-size="10">${num(Math.round(v))}</text>`;
  }
  let bars = "";
  months.forEach((m, i) => {
    const cx = pad.l + i * gw + gw / 2;
    const hist = m.role === "history";
    if (hist) bars += `<rect x="${cx-gw/2+4}" y="${pad.t}" width="${gw-8}" height="${innerH}" fill="rgba(63,185,80,.06)"/>`;
    const f = m.forecastOut || 0;
    const a = m.actualOut || 0;
    if (hist) {
      bars += `<rect x="${cx-barW-2}" y="${y(f)}" width="${barW}" height="${Math.max(0, y(0)-y(f))}" fill="#4f9cf9" rx="2"/>`;
      bars += `<rect x="${cx+2}" y="${y(a)}" width="${barW}" height="${Math.max(0, y(0)-y(a))}" fill="#3fb950" rx="2"/>`;
    } else {
      bars += `<rect x="${cx-barW/2}" y="${y(f)}" width="${barW}" height="${Math.max(0, y(0)-y(f))}" fill="#79b8ff" rx="2"/>`;
    }
    const label = fmtMonth(m.key || m.date) !== "—" ? fmtMonth(m.key || m.date) : ("M" + (i + 1));
    bars += `<text x="${cx}" y="${H-12}" text-anchor="middle" fill="${hist?"#3fb950":"#8b98a5"}" font-size="11">${esc(label)}${hist?" · act":""}</text>`;
  });
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}</svg>
    <div class="legend">
      <span${tipAttr(TIPS.timelineForecast, "Sales Forecast submitted")}><i class="sw" style="background:#4f9cf9"></i>Sales Forecast submitted</span>
      <span${tipAttr(TIPS.timelineActual, "Actual")}><i class="sw" style="background:#3fb950"></i>Actual (on hire)</span>
      <span${tipAttr("Next four months from the submitted Sales Forecast — not Forecast Orders.", "Forward Sales Forecast")}><i class="sw" style="background:#79b8ff"></i>Forward Sales Forecast</span>
    </div>
  </div>`;
}

function chartAxes(W, H, pad, max) {
  const innerH = H - pad.t - pad.b;
  const y = (v) => pad.t + innerH - (Math.max(0, v) / max) * innerH;
  const ticks = 4;
  let grid = "";
  for (let i = 0; i <= ticks; i++) {
    const v = max * (i / ticks);
    const yy = y(v);
    grid += `<line x1="${pad.l}" y1="${yy}" x2="${W - pad.r}" y2="${yy}" stroke="#2d3845"/>`;
    grid += `<text x="${pad.l - 6}" y="${yy + 3}" text-anchor="end" fill="#8b98a5" font-size="10">${num(Math.round(v))}</text>`;
  }
  return { y, grid, innerH, innerW: W - pad.l - pad.r };
}

function demandMonthLabel(m, mode, refs) {
  const key = fmtMonth(m.date) !== "—" ? fmtMonth(m.date) : ("M" + m.index);
  if (m.beyond) return key + " · after SF";
  if (mode === "buy" && m.index >= 4) return key + " · buy";
  if (mode === "stock" && refs && refs.peakIndex === m.index) return key + " · peak";
  return key;
}

function demandBuyChart(months) {
  const W = 760, H = 240;
  const pad = { l: 56, r: 14, t: 18, b: 34 };
  const vals = (months || []).flatMap((m) => [m.outUnits || 0, m.poUnits || 0, m.projUnits || 0]);
  const max = Math.max(1, ...vals);
  const { y, grid, innerH, innerW } = chartAxes(W, H, pad, max);
  const n = Math.max(1, (months || []).length);
  const gw = innerW / n;
  const barW = Math.max(10, gw / 5.2);
  const gap = 3;
  let bars = "";
  (months || []).forEach((m, i) => {
    const cx = pad.l + i * gw + gw / 2;
    const buy = m.beyond || m.index >= 4;
    if (buy) bars += `<rect x="${cx - gw / 2 + 4}" y="${pad.t}" width="${gw - 8}" height="${innerH}" fill="rgba(32,201,151,.08)"/>`;
    const series = [
      [m.outUnits || 0, "#4f9cf9"],
      [m.poUnits || 0, "#39d0d8"],
      [m.projUnits || 0, "#20c997"],
    ];
    const total = series.length * barW + (series.length - 1) * gap;
    const x0 = cx - total / 2;
    series.forEach(([v, color], k) => {
      const x = x0 + k * (barW + gap);
      bars += `<rect x="${x}" y="${y(v)}" width="${barW}" height="${Math.max(0, y(0) - y(v))}" fill="${color}" rx="2"/>`;
      if (v > 0 && (k === 2 || v / max > 0.1)) {
        bars += `<text x="${x + barW / 2}" y="${y(v) - 4}" text-anchor="middle" fill="${color}" font-size="9">${num(Math.round(v))}</text>`;
      }
    });
    bars += `<text x="${cx}" y="${H - 12}" text-anchor="middle" fill="${buy ? "#20c997" : "#8b98a5"}" font-size="11">${esc(demandMonthLabel(m, "buy"))}</text>`;
  });
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}</svg>
    <div class="legend">
      <span${tipAttr(TIPS.outStarts, "OUT starts")}><i class="sw" style="background:#4f9cf9"></i>OUT starts</span>
      <span${tipAttr(TIPS.poBacked, "Waiting POs")}><i class="sw" style="background:#39d0d8"></i>Waiting POs (too late to buy)</span>
      <span${tipAttr(TIPS.projPo, "Projected POs")}><i class="sw" style="background:#20c997"></i>Projected POs (this buy)</span>
    </div>
  </div>`;
}

function monthInUnfiled(m) {
  if (m && m.inUnfiled) return true;
  const out = m && m.outUnits || 0;
  const inn = m && m.inUnits || 0;
  const net = m && m.netUnits || 0;
  return out > 0 && Math.abs(net) < 0.5 && Math.abs(inn - out) < 0.5;
}

function demandStockChart(months, refs) {
  const W = 760, H = 248;
  const pad = { l: 56, r: 118, t: 22, b: 34 };
  const vals = (months || []).flatMap((m) => {
    const row = [m.outUnits || 0, m.projectedInService || 0];
    if (!monthInUnfiled(m)) row.push(m.inUnits || 0, Math.abs(m.netUnits || 0));
    return row;
  });
  if (refs) {
    if (refs.required) vals.push(refs.required);
    if (refs.forecastMax) vals.push(refs.forecastMax);
    if (refs.cover) vals.push(refs.cover);
  }
  const max = Math.max(1, ...vals);
  const { y, grid, innerH, innerW } = chartAxes(W, H, pad, max);
  const n = Math.max(1, (months || []).length);
  const gw = innerW / n;
  const barW = Math.max(8, gw / 6);
  let bars = "";
  let linePts = [];
  let hasIn = false;
  let hasHeld = false;
  let hasReleased = false;
  (months || []).forEach((m, i) => {
    const cx = pad.l + i * gw + gw / 2;
    const peak = refs && refs.peakIndex === m.index;
    if (peak) bars += `<rect x="${cx - gw / 2 + 4}" y="${pad.t}" width="${gw - 8}" height="${innerH}" fill="rgba(79,156,249,.08)"/>`;
    const out = m.outUnits || 0;
    const unfiled = monthInUnfiled(m);
    const inn = unfiled ? 0 : (m.inUnits || 0);
    const net = unfiled ? 0 : (m.netUnits || 0);
    if (!unfiled && inn > 0) hasIn = true;
    if (net > 0) hasHeld = true;
    if (net < 0) hasReleased = true;
    bars += `<rect x="${cx - barW * 1.6}" y="${y(out)}" width="${barW}" height="${Math.max(0, y(0) - y(out))}" fill="#4f9cf9" rx="2"/>`;
    if (!unfiled) {
      bars += `<rect x="${cx - barW * 0.5}" y="${y(inn)}" width="${barW}" height="${Math.max(0, y(0) - y(inn))}" fill="#3fb950" rx="2"/>`;
      const netFill = net >= 0 ? "#f85149" : "#a371f7";
      bars += `<rect x="${cx + barW * 0.6}" y="${y(Math.abs(net))}" width="${barW}" height="${Math.max(0, y(0) - y(Math.abs(net)))}" fill="${netFill}" rx="2"/>`;
      if (net < 0 && Math.abs(net) > 0) {
        bars += `<text x="${cx + barW * 1.1}" y="${y(Math.abs(net)) - 4}" text-anchor="middle" fill="#a371f7" font-size="9">${signed(net, 0)}</text>`;
      }
    } else {
      bars += `<text x="${cx}" y="${y(out) - 6}" text-anchor="middle" fill="#8b98a5" font-size="9">IN not filed</text>`;
    }
    const label = demandMonthLabel(m, "stock", refs) + (unfiled ? " · no IN" : "");
    bars += `<text x="${cx}" y="${H - 12}" text-anchor="middle" fill="${peak ? "#4f9cf9" : "#8b98a5"}" font-size="11">${esc(label)}</text>`;
    linePts.push(`${cx},${y(m.projectedInService || 0)}`);
  });
  let refsSvg = "";
  const dash = (value, color, label) => {
    if (!value) return "";
    const yy = y(value);
    return `<line x1="${pad.l}" y1="${yy}" x2="${W - pad.r}" y2="${yy}" stroke="${color}" stroke-dasharray="5 4" stroke-width="1.4"/>
      <text x="${W - pad.r + 4}" y="${yy + 3}" fill="${color}" font-size="10">${esc(label)} ${num(Math.round(value))}</text>`;
  };
  if (refs) {
    refsSvg += dash(refs.required, "#f85149", "Required");
    refsSvg += dash(refs.cover, "#8b98a5", "Cover");
  }
  const dots = (months || []).map((m, i) => {
    const cx = pad.l + i * gw + gw / 2;
    return `<circle cx="${cx}" cy="${y(m.projectedInService || 0)}" r="3.5" fill="#d29922"/>`;
  }).join("");
  const legend = [
    `<span${tipAttr(TIPS.outStarts, "OUT starts")}><i class="sw" style="background:#4f9cf9"></i>OUT starts</span>`,
    hasIn ? `<span${tipAttr(TIPS.inReturning, "IN returning")}><i class="sw" style="background:#3fb950"></i>IN returning</span>` : "",
    hasHeld ? `<span${tipAttr(TIPS.netHeld, "NET extra held")}><i class="sw" style="background:#f85149"></i>NET extra held</span>` : "",
    hasReleased ? `<span${tipAttr(TIPS.netReleased, "NET released")}><i class="sw" style="background:#a371f7"></i>NET released (IN &gt; OUT)</span>` : "",
    `<span${tipAttr(TIPS.projectedIS, "Projected in service")}><i class="sw" style="background:#d29922"></i>Projected in service</span>`,
    refs && refs.required ? `<span${tipAttr(TIPS.requiredLine, "Required")}><i class="sw" style="background:transparent;border:1px dashed #f85149"></i>Required</span>` : "",
    refs && refs.cover ? `<span${tipAttr(TIPS.coverLine, "Stock + on order")}><i class="sw" style="background:transparent;border:1px dashed #8b98a5"></i>Stock + on order</span>` : "",
  ].filter(Boolean).join("");
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}${refsSvg}
      <polyline fill="none" stroke="#d29922" stroke-width="2" points="${linePts.join(" ")}"/>${dots}
    </svg>
    <div class="legend">${legend}</div>
  </div>`;
}

            <td class="pick l"><input type="checkbox" class="pick-item" data-code="${esc(m.code)}" ${isPicked(m.code)?"checked":""} /></td>
            ${tdTip(`<b>${esc(m.code)}</b><div class="muted">${esc(clip(m.name,15))}</div>`, TIPS.item, "", true)}

}

function demandCharts(months, refs, familyMode) {
  if (familyMode || demandChartMode === "stock") return demandStockChart(months, refs);
  return demandBuyChart(months);
}

function drawDemand() {
  const d = demand;
  const it = d.item;
  const fam = d.family || {};
  const nat = d.national || {};
  const pickedMode = demandScope === "picked" && pickedCodes.length >= 2 && fam.name;
  const viewFam = pickedMode ? rollupFamily(fam, pickedCodes) : fam;
  const familyMode = ((demandScope === "family" || pickedMode) && viewFam.name);
  const nationalMode = demandScope === "national";
  const natTot = nat.totals || {};
  const natPeakRow = (nat.timeline || [])
    .filter((r) => r.role === "forecast")
    .reduce((a, b) => ((b.forecastOut || 0) > (a.forecastOut || 0) ? b : a), { forecastOut: 0, key: "" });
  const natPeakUnits = natPeakRow.forecastOut || natTot.peakForecastOut || 0;
  const peak = (familyMode ? viewFam.peakMonth : d.peakMonth) || {};
  const baseMonths = mergePoMonths(familyMode ? (viewFam.months || []) : d.months, familyMode ? null : d.conversion);
  const buyMonths = familyMode ? baseMonths : appendBeyondMonth(baseMonths, d.conversion);
  const buyMode = !familyMode && demandChartMode !== "stock";
  const months = buyMode ? buyMonths : baseMonths;
  const tableMonths = familyMode ? baseMonths : buyMonths;
  const peakLabel = peak.date ? fmtMonth(peak.date) : `Month ${peak.index}`;
  const famRequired = isPeakAsk() ? (viewFam.peakRequired != null ? viewFam.peakRequired : viewFam.required) : viewFam.required;
  const famOrderQty = isPeakAsk() ? (viewFam.peakQty != null ? viewFam.peakQty : viewFam.orderQty) : viewFam.orderQty;
  const famOrderCost = isPeakAsk() ? (viewFam.peakCost != null ? viewFam.peakCost : viewFam.orderCost) : viewFam.orderCost;
  const famShortfall = isPeakAsk()
    ? (viewFam.peakShortfall != null ? viewFam.peakShortfall : (famRequired || 0) - (viewFam.cover || 0))
    : viewFam.shortfall;
  const famLines = isPeakAsk()
    ? (viewFam.members || []).filter((m) => askQty(m) > 0).length
    : viewFam.orderLines;
  const itemIs = isPeakAsk() ? (d.peakIs != null ? d.peakIs : it.peakIs) : d.buyIs;
  const itemRequired = isPeakAsk() ? (it.peakRequired || 0) : d.required;
  const itemQty = askQty(it);
  const itemMonth = isPeakAsk()
    ? (fmtMonth(it.peakMonthKey) !== "—" ? fmtMonth(it.peakMonthKey) : peakLabel)
    : (fmtMonth(it.buyMonthKey) !== "—" ? fmtMonth(it.buyMonthKey) : "month 4");
  const why = nationalMode
    ? `${esc(nat.name || fam.name || "Family")} national view uses submitted Sales Forecast from ${(nat.statesUsed || []).join(", ") || "no states yet"} — not Forecast Orders. Peak submitted starts are ${num(Math.round(natPeakUnits))} family units${natPeakRow.key ? " in " + esc(fmtMonth(natPeakRow.key)) : ""}. System required from each state’s latest calculator is ${num(natTot.required || 0)}; stock + on order cover ${num(natTot.cover || 0)}, shortfall ${num(natTot.shortfall || 0)}.`
    : familyMode
    ? `${esc(fam.name)} ${pickedMode ? "selected " + num(viewFam.itemCount) + " of " + num(fam.itemCount) : "is " + num(fam.itemCount)} items in ${esc(state)}. The ${isPeakAsk() ? "peak-month" : "buy-month"} ask uses ${isPeakAsk() ? "peak-month" : "last-forecast-month"} in-service. Combined required is ${num(famRequired)}; stock + on order cover ${num(viewFam.cover)}; shortfall ${num(famShortfall)}. Ask is ${famOrderQty ? num(famOrderQty) + " units · " + aud(famOrderCost) : "none"} (${num(famLines)} lines).${pickedMode ? " Bars and cards are the ticked items only." : ""}`
    : (itemQty > 0)
      ? `${it.code} is on the ${isPeakAsk() ? "peak-month" : "buy-month"} ask for ${esc(itemMonth)}, when projected in-service is ${num(Math.round(itemIs || 0))}. At ${pct(it.targetUtil)} you need ${num(itemRequired)} in the fleet. Cover is ${num(d.cover)}, so the ask is ${num(itemQty)}.`
      : `${it.code} has no ${isPeakAsk() ? "peak-month" : "buy-month"} shortfall. Projected in-service ${num(Math.round(itemIs || 0))} at ${pct(it.targetUtil)} needs ${num(itemRequired)}; stock + current orders cover ${num(d.cover)}.`;
  const peakWhy = !nationalMode && peak.outUnits
    ? ` Strongest new-site demand is ${peakLabel}: ${num(Math.round(peak.outUnits))} units going to site, ${num(Math.round(peak.inUnits || 0))} returning, net ${num(Math.round(peak.netUnits || 0))}. That month is too late for this buy — use interstate transfers or other ops, not dollars.`
    : "";
  const dur = d.duration || {};
  const durWhy = !familyMode && !nationalMode && dur.delta != null && Math.abs(dur.delta) >= 0.5
    ? ` Hire duration has ${dur.direction === "longer" ? "increased" : "decreased"} ${signed(dur.delta, 1)} days versus ${esc(dur.priorMonth || "last forecast")} (weighted by customer size). ${dur.direction === "longer" ? "Stock is staying out longer, so less comes back to install again." : "Jobs are turning faster, so more stock comes back."}`
    : "";
  const kpis = nationalMode
    ? [
        ["Peak SF units", num(Math.round(natPeakUnits)), "", TIPS.timelineForecast],
        ["Required at target", num(natTot.required || 0), "", TIPS.required],
        ["Total + on order", num(natTot.cover || 0), "", TIPS.cover],
        ["Shortfall", num(natTot.shortfall || 0), cls(-(natTot.shortfall || 0)), TIPS.shortfall],

        ["Now in service", num(natTot.inService || 0), "", TIPS.nowInService],
      ]
    : familyMode
    ? [
        ["Peak IS (ops)", num(viewFam.forecastMax), "", TIPS.forecastMax],
        [askNoun() + " required", num(famRequired), "", TIPS.required],
        ["Total + on order", num(viewFam.cover), "", TIPS.cover],
        [askNoun() + " shortfall", num(famShortfall), cls(-famShortfall), TIPS.shortfall],
        [askNoun() + " qty", famOrderQty ? num(famOrderQty) : "—", "", TIPS.proposedBuy],
        ["Now in service", num(viewFam.inService), "", TIPS.nowInService],
      ]
    : [
        ["Peak IS (ops)", num(it.forecastMax), "", TIPS.forecastMax],
        [isPeakAsk() ? "Peak month IS" : "Buy month IS", num(Math.round(itemIs || 0)), "", isPeakAsk() ? "Projected in-service in the peak-starts month." : "Projected in-service in the last forecast month — the only month this buy can serve."],
        [askNoun() + " required", num(itemRequired), "", TIPS.required],
        ["Total + on order", num(d.cover), "", TIPS.cover],
        [askNoun() + " qty", itemQty ? num(itemQty) : "—", "", TIPS.proposedBuy],
        ["Now in service", num(it.inService), "", TIPS.nowInService],
      ];
  const refs = {
    required: familyMode ? famRequired : itemRequired,
    forecastMax: familyMode ? viewFam.forecastMax : it.forecastMax,
    cover: familyMode ? viewFam.cover : d.cover,
    peakIndex: peak.index,
  };

  $("view-demand").innerHTML = `
    <div class="demand-head">
      <div class="seg" id="demandScope">
        <button data-scope="item" class="${!familyMode?"on":""}">${esc(it.code)}</button>

      </div>
    </div>
    <div class="why">

      <p>${why}${peakWhy}${durWhy}</p>
      <p class="muted">${nationalMode ? "Submitted Sales Forecast LM × each state’s qty/m for this family, then summed. Forecast Orders (GM-adjusted) is not used for the bars." : (pickedMode ? "Selected items only. Units sum LM × each ticked item’s qty/m. Hires are not summed — the same job uses many items." : familyMode ? "This state’s family only. Family totals sum each item’s units (LM × that item’s qty/m). Hires are not summed — the same job uses many items." : esc(d.note)) + " Source " + esc(d.sfFile) + (d.sfExport ? " · " + esc(d.sfExport) : "") + "."}</p>
    </div>
    <div class="cards">
      ${kpis.map(([label, val, klass, def]) => kpiCard(label, val, klass, def)).join("")}
    </div>
    ${nationalMode ? familyTimelineBlock({ ...nat, name: nat.name || fam.name, timelineStates: nat.statesUsed }) + nationalStateTable(nat) : familyMode ? (pickedMode ? `<p class="muted">The 6-month timeline is the whole family. Bars and cards are the ${num(viewFam.itemCount)} selected items.</p>` : "") + familyTimelineBlock(fam) : firmBlock(d) + inputsBlock()}
    ${nationalMode ? "" : `<div class="chart-head">
      <h2>${familyMode ? "Demand over the forecast period" : buyMode ? "Buy window" : "Stock path"}</h2>
      ${familyMode ? "" : `<div class="seg" id="demandChartMode">
        <button data-chart="buy" class="${buyMode ? "on" : ""}">Buy window</button>
        <button data-chart="stock" class="${buyMode ? "" : "on"}">Stock path</button>

    </div>
    <p class="muted">${familyMode
      ? (pickedMode ? "Selected items in " : "All items in ") + esc(fam.name) + " — starts, returning stock, net extra held, and projected in-service versus required / cover. Required and cover are labelled on the right. A month with IN not filed has no returning in Sales Forecast."
      : buyMode
        ? "Decide the buy here. Only the last forecast month is a buy month (Dec 2026 on a Sep 2026 file) — Nov 2026 is too soon. Blue = forecast starts. Cyan = waiting POs already raised (too late). Teal = projected raises that land in that last month or after the forecast, still inside the 4-month lead. Required and cover are on Stock path."
        : "Starts, returning stock, net extra held, and projected in-service. Required and stock + on order are the labelled dashed lines. POs are on Buy window. If a month says IN not filed (Dec 2026 often), Sales Forecast left returning at 0 because OUT is override-only — we do not copy OUT into IN."}</p>
